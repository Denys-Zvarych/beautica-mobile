name: beautica_mobile
description: "Beautica — beauty services booking platform (Flutter app)"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# Version: 1.0.0+1 — bumped via Phase 11.6 release discipline.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Runtime dependencies — locked stack per ARCHITECTURE-mobile.md § 2.
# Codegen-generated files (.g.dart / .freezed.dart) and api/** land in
# Phase 1+ / Phase 3.1 — Phase 0 only wires the deps so future phases compile.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State management — Riverpod 2.x with riverpod_generator codegen.
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Routing — go_router, integrates with Riverpod via refreshListenable.
  go_router: ^17.2.3

  # HTTP — Dio + interceptor chain wired in Phase 2.x.
  dio: ^5.7.0

  # Secure storage — Android Keystore-backed; refresh-token home.
  flutter_secure_storage: ^10.2.0

  # Push notifications — Firebase deps removed until Phase 8.1 FCM init ships
  # (Perf MEDIUM-1 2026-05-24: both packages added ~5-7 MB to the release APK
  # while unused; no Firebase.initializeApp() call, no google-services.json).
  # Re-add firebase_core ^4.9.0 + firebase_messaging ^16.2.2 in Phase 8.1.

  # Design system — Manrope via google_fonts (full Cyrillic glyph set).
  google_fonts: ^8.1.0

  # Models / serialization — freezed + json_serializable codegen.
  # Upgraded to ^3.0.0 in Phase 1.4 to align with custom_lint ^0.8.x which
  # requires freezed_annotation ^3; the ^2.x constraint broke build_runner.
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Localization — intl 0.19 keeps lockstep with flutter_localizations on
  # Flutter 3.41; flutter_intl tooling can bump it later.
  intl: any

  # OpenAPI generated client — Phase 3.1. Generated by openapi-generator-cli
  # (standalone JAR, no build_runner annotation package) into api/ (root-level,
  # outside lib/ to avoid Dart package-path overlap) and referenced as a path
  # dependency. Uses built_value serialization internally.
  # NEVER edit api/ by hand — regenerate via ./scripts/regenerate_api.sh.
  beautica_api:
    path: api

  # Runtime deps required by the generated beautica_api package (built_value
  # serialization + one_of discriminated unions from OpenAPI 3.1 oneOf).
  built_value: ^8.9.3
  built_collection: ^5.1.1
  one_of: '>=1.5.0 <2.0.0'
  one_of_serializer: '>=1.5.0 <2.0.0'

  # OpenAPI client codegen annotation — deferred to Phase 3.1; pinning it
  # here together with riverpod_lint 2.6.x produces an irreconcilable
  # analyzer version conflict (annotations pull openapi_generator's analyzer
  # <7.0.0 constraint, riverpod_lint requires analyzer ^7).

  # Screen security — preventScreenshotOn/Off on login/register screens prevents
  # task-switcher screenshots and screen recording (MS-4).
  screen_protector: ^1.5.1

  # Native splash screen — preserves the branded warm-taupe splash through
  # Flutter engine startup; `FlutterNativeSplash.remove()` is called from
  # SplashScreen.initState() to hand off to the Phase 2.10 animation. Phase 2.15.
  flutter_native_splash: ^2.4.4

  # Lottie animations — used for the splash wordmark reveal animation
  # (`assets/lottie/splash_wordmark.json`). The splash screen renders the
  # Lottie wordmark as the animated "beautica" text below the static
  # VelvetLogo B-pillow. Restored 2026-05-27 after the user requested the
  # animation be recovered alongside the static logo.
  lottie: ^3.1.0

  # Logging — dart:developer log() is the official channel; no extra package.
  cupertino_icons: ^1.0.8

  # External link launching — opens the master's Instagram profile (validated
  # https URL only) in the Instagram app or browser via ACTION_VIEW. The stored
  # value is sanitized through shared/utils/instagram_url.dart before launch.
  # Requires the <queries> ACTION_VIEW/https entry in AndroidManifest.xml for
  # Android 11+ package visibility.
  url_launcher: ^6.3.2

  # File picking — support "Напишіть нам" attachments (images + PDF). Returns
  # bytes (withData) so the support repository can build multipart parts without
  # a second filesystem read. Limits (count/size/type) are enforced client-side
  # after selection; the backend re-validates by magic-byte sniffing.
  file_picker: ^8.1.6

  # Multipart MediaType for the support-contact request part (the JSON `request`
  # part carries Content-Type: application/json; file parts carry their sniffed
  # type). Dio does not re-export MediaType, so http_parser is a direct dep.
  http_parser: ^4.1.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Codegen runners.
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0+1
  # Upgraded to ^3.0.0 alongside freezed_annotation ^3 (Phase 1.4).
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  # openapi_generator deferred to Phase 3.1 — version conflict with
  # riverpod_lint's required analyzer ^7. Re-add when the OpenAPI client lands.

  # Testing — mocktail (no codegen).
  # golden_toolkit removed 2026-05-26 — discontinued on pub.dev; was declared but never imported.
  # When golden tests are needed, use Flutter's built-in matchesGoldenFile or the alchemist package.
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1

  # Declared so widget tests can swap UrlLauncherPlatform.instance for a mock
  # (mocktail + MockPlatformInterfaceMixin) when asserting launchUrl behavior.
  # Both are transitive via url_launcher; declaring them here satisfies the
  # depend_on_referenced_packages lint that CI runs.
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

  # Regression safety net (2026-06-02): http_mock_adapter fakes the HTTP socket
  # at the Dio transport layer so the REAL repository + REAL Dio + REAL generated
  # built_value serialization execute end-to-end with no live backend. This
  # catches contract / serialization drift that mocking the generated API class
  # (the old master_repository_test.dart blind spot) cannot see.
  http_mock_adapter: ^0.6.1

  # Integration tests (integration_test/) — drives the real app widget tree
  # headless under `flutter test integration_test/...` with a faked Dio
  # transport (no live backend needed in CI).
  integration_test:
    sdk: flutter

  # Native E2E (Phase 17.5) — patrol drives OS-level surfaces that
  # integration_test cannot reach: permission dialogs, notifications, deep-link
  # intents and WebViews via `$.native.*`. patrol 4.6.x requires Dart >=3.8 /
  # Flutter >=3.32 — satisfied by this project's Flutter 3.41 / Dart 3.11.
  #
  # patrol native tests run ONLY on an Android emulator/device under native
  # instrumentation (PatrolJUnitRunner) — NOT under `flutter test`. They are
  # driven by the patrol_cli global tool (`patrol test`), which is intentionally
  # NOT a repo dependency: install it in CI / locally via
  #   dart pub global activate patrol_cli
  # See integration_test/patrol/README.md for the full runbook. The fast
  # headless `flutter test integration_test/all_tests.dart` path is unaffected —
  # patrol tests live under integration_test/patrol/ and are excluded from the
  # aggregator.
  patrol: ^4.6.1

  # Lints — flutter_lints + riverpod_lint via custom_lint.
  # Upgraded custom_lint stack to ^0.8.1 in Phase 1.4 to resolve the
  # analyzer_plugin 0.12.0 vs analyzer 7.6.0 incompatibility that prevented
  # build_runner from compiling the build script. Both custom_lint and
  # custom_lint_builder must be pinned to the same minor version.
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  custom_lint_builder: ^0.8.1
  riverpod_lint: ^3.1.0

  # Launcher icon generator — runs at build prep time only (Phase 2.14).
  # Generates Android mipmap-*/launcher_icon.png, adaptive-icon XML, themed
  # monochrome variant, and the iOS AppIcon.appiconset family from the
  # source PNGs in assets/branding/.
  flutter_launcher_icons: ^0.14.1
  alchemist: ^0.14.0

# Patrol native-test configuration (Phase 17.5) — read by `patrol test` /
# `patrol_cli`. Top-level key (the patrol_cli tool, not the Flutter framework,
# consumes it). app_name is cosmetic; android.package_name MUST match the
# applicationId in android/app/build.gradle.kts so patrol can install + drive
# the right APK. iOS is declared for parity but iOS native patrol is not part of
# this phase (Android-only emulator job in CI).
patrol:
  app_name: Beautica
  # patrol_cli defaults test_directory to `patrol_test`; without this key the
  # generated bundle import is built from the project's ABSOLUTE path, and the
  # `beautica-mobile` hyphen breaks the Dart import-prefix alias
  # ("Expected a declaration, but got '-'"). Pointing it at integration_test
  # lets patrol_cli strip the project path → valid relative alias.
  test_directory: integration_test
  android:
    package_name: com.beautica.beautica_mobile
  ios:
    bundle_id: com.beautica.beauticaMobile

# Launcher icon configuration — read by `dart run flutter_launcher_icons`.
# Lives at the TOP level (not under `flutter:`) because the dev tool — not the
# Flutter framework — consumes it. Phase 2.14.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/launcher_icon_source.png"
  image_path_android: "assets/branding/launcher_icon_source.png"
  image_path_ios: "assets/branding/launcher_icon_source.png"
  # Android 8+ adaptive icon layers (mandatory since target API 26+).
  adaptive_icon_background: "#E6DDD0"
  adaptive_icon_foreground: "assets/branding/launcher_icon_foreground.png"
  # Android 13+ themed icons (monochrome silhouette tinted by user's wallpaper).
  adaptive_icon_monochrome: "assets/branding/launcher_icon_monochrome.png"
  # macOS / Windows / web deferred — only Android + iOS for MVP.
  # In flutter_launcher_icons 0.14.x these platforms default to disabled when
  # the key is omitted; passing `false` is a schema-cast error (expects Map).

# Flutter section — enables Material icons + l10n codegen (`flutter gen-l10n`).
# Native splash configuration — read by `dart run flutter_native_splash:create`.
# Phase 2.15. Background: VelvetTouch warm taupe #E6DDD0 (= BrandColors.base),
# NOT the stale espresso #0D0906 from the phase-doc draft.
#
# Strategy (revised 2026-05-27): OS native splash shows BACKGROUND COLOR ONLY —
# no logo, no B-pillow PNG. Rationale: the OS-baked PNG and Flutter's runtime
# VelvetLogo cannot guarantee identical on-screen position + visual quality
# across Android/iOS density buckets (release builds showed a visible
# position+size jump at the OS→Flutter handoff). By stripping the logo from
# the OS layer, the Flutter splash becomes the SOLE owner of the logo render.
# Users see a brief warm-taupe flash, then the Flutter splash paints the
# B-pillow exactly once at viewport center — zero handoff jump.
flutter_native_splash:
  color: "#E6DDD0"                                # VelvetTouch warm taupe — matches BrandColors.base
  color_dark: "#E6DDD0"                           # light-only design system; always warm taupe
  # No image / image_dark — bg color only. Flutter splash owns the logo.

  android: true
  ios: true
  web: false

  # Android 12+ SplashScreen API (windowSplashScreenAnimatedIcon).
  # Without an explicit `image:` here, Android 12+ falls back to the LAUNCHER
  # icon (mipmap-*/launcher_icon.png) — a "B"-in-rounded-rectangle adaptive
  # icon whose rounded-rect background is the same #E6DDD0 as the splash bg,
  # producing a bare "B" glyph mid-splash. To suppress that glyph entirely
  # we point at a 1×1 fully-transparent PNG: the OS still renders an icon
  # layer but it has zero visible pixels, so users see only the bg color
  # until the Flutter engine takes over.
  android_12:
    color: "#E6DDD0"
    color_dark: "#E6DDD0"
    # 1×1 transparent PNG — overrides the launcher icon that Android 12+
    # would otherwise auto-show. See note above.
    image: assets/branding/splash_icon_blank.png

  android_gravity: center
  fullscreen: true

  ios_content_mode: center

flutter:
  uses-material-design: true
  generate: true
  # assets/branding/ is intentionally NOT listed here — those files are
  # build-time inputs for flutter_launcher_icons and flutter_native_splash
  # only and are never loaded via Image.asset() at runtime.
  assets:
    # Bundled font files for Comfortaa (w600/w700) and Nunito (w400/w600/w700/w800).
    # google_fonts automatically prefers these over network fetches when
    # allowRuntimeFetching = false (see main.dart). Required for release APKs
    # where there is no network fallback and where kDebugMode = false previously
    # caused the wordmark to fall back to the system font.
    - assets/fonts/

    # Lottie animations directory. The splash screen renders
    # `assets/lottie/splash_wordmark.json` as the animated "beautica" wordmark
    # below the static VelvetLogo B-pillow. See assets/lottie/README.md for
    # the design spec.
    - assets/lottie/

    # TLS certificate for Dio cert-pinning (MEDIUM-3, mobile-security 2026-05-27).
    # The ISRG Root X1 PEM is used by IOHttpClientAdapter on both Android
    # (belt — alongside network_security_config.xml) and iOS (suspenders —
    # no OS-level equivalent to Android's network_security_config).
    - assets/certs/

    # Monochrome SVG icons — drop free line SVGs here, register a const in
    # BeauticaAssetIcons (lib/core/icons/beautica_asset_icons.dart), then
    # use AppIcon(BeauticaAssetIcons.x) anywhere.
    - assets/icons/
