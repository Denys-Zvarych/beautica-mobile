# Selector rules (phase 398 D5). The Dart code holds NO paths; every path,
# glob and threshold lives here, and every entry has a case in
# test/selector_test.dart (mutation-checked, see phase doc).
#
# Classification order for each changed path (first match wins):
#   full_before_none -> FULL | none_globs -> ignored | arb / golden_assets / path_includes -> mapped
#   | full_globs -> FULL | dart under graph_roots -> seed
#   | anything else -> FULL (fail-safe)

# Dart packages that can appear in import URIs and where they live.
packages:
  beautica_mobile: lib
  # The OpenAPI client; its real name is read from api/pubspec.yaml at runtime
  # and mapped to api/lib (this entry is the fallback).
  beautica_api: api/lib

# Directories scanned for the import graph.
graph_roots: [lib, api/lib, test, integration_test]

# Carve-outs of a none glob that must force FULL anyway (checked FIRST).
# Parity with the workflow's `is_forced` guard (phase 400, 398 R1): the Gradle
# wrapper / properties are build-toolchain config the `apk` job's APK builds
# consume, so the guard forces FULL even though android/** is otherwise
# patrol-only. Pinned by test/guard_parity_test.dart.
# '.github/**/*.md': the guard forces FULL for every .github/* path, but
# '**/*.md' would otherwise swallow .github/PULL_REQUEST_TEMPLATE/*.md as none
# (398 R1 parity). Non-.md .github files already classify full.
full_before_none:
  - '.github/**/*.md'
  - 'android/gradle/wrapper/**'
  - 'android/gradle.properties'

# Changes that cannot affect any test the selector runs.
# (.github/workflows/gitleaks.yml used to be here; the workflow guard forces
# FULL for every .github/** change, so it is FULL here too: parity, 398 R1.)
none_globs:
  - 'docs/**'
  - '**/*.md'
  - '.gitignore'
  - '.gitleaksignore'
  - '.metadata'
  - '*.iml'
  - 'assets_design/**'
  # Native shells: exercised by patrol only, which plan.sh/native gates.
  - 'android/**'
  - 'ios/**'
  - 'windows/**'
  # Generated-client by-products that are not Dart sources.
  - 'api/doc/**'
  - 'api/test/**'
  - 'api/.openapi-generator/**'
  - 'api/.openapi-generator-ignore'
  # Perf measurement scripts have their own tests (scripts/perf/tests, CI-only).
  - 'scripts/perf/**'
  # OpenAPI snapshot: read only by `scripts/regenerate_api.sh --check`, the
  # drift gate in the `gates` job (was `validate`), which runs on EVERY PR regardless of
  # mode. No test reads it; the regenerated api/lib Dart files seed on their own.
  - 'tool/openapi/**'

# Changed path -> fixed test set (never FULL, never a graph seed). Aggregator
# entrypoints are run whole by the `integration` job on every PR; the only unit
# tests that read them are the two meta tests.
path_includes:
  - when: ['integration_test/all_tests*.dart']
    include:
      - 'test/integration_aggregator_meta_test.dart'
      - 'test/patrol_excluded_from_fast_path_test.dart'

# Committed golden PNGs: every *_test.dart directly beside the `goldens/` folder
# is selected. A PNG not directly under a `goldens/` dir, or with no sibling
# tests, goes FULL.
golden_assets:
  globs: ['test/**/goldens/*.png']

# ARB: diffed against BASE per key. Selected: lib files that mention a changed
# key (seeds), tests/flows that mention the key or a placeholder-free fragment
# of its old/new text, tests that read .arb files, test/l10n/**. No BASE tree,
# unparsable JSON or a changed @@global -> FULL.
arb:
  globs: ['lib/l10n/*.arb']
  reader_literal: '\.arb|l10n/app_(uk|en)'
  include_always: ['test/l10n/**']

# Anything here forces mode=full.
full_globs:
  - 'pubspec.yaml'
  - 'pubspec.lock'
  - 'analysis_options.yaml'
  - 'dart_test.yaml'
  - 'build.yaml'
  - 'l10n.yaml'
  - 'assets/**'              # fonts/images feed goldens
  - 'api/pubspec.yaml'
  - 'api/build.yaml'
  - 'test/flutter_test_config.dart'
  - 'test/helpers/**'
  - 'test/ci/**'               # workflow/guard meta tests (is_forced parity, 398 R1)
  - 'integration_test/support/**'
  - 'integration_test/fixtures/**'
  - 'test_driver/**'
  - 'tool/ci/**'
  - 'scripts/**'             # (scripts/perf/** is carved out via none_globs)
  - '.github/workflows/**'
  - 'trusted'                # the integration job checks the base commit out here (401 S2)
  - 'trusted/**'

# Any non-.dart file under these roots that no glob above matched (golden PNGs,
# JSON fixtures, ...) forces FULL. Dart files are handled by the graph.
full_nondart_roots: [lib, test]

# Cardinality ledgers: tests that count/enumerate things must run whole when
# the thing they count can have changed.
ledgers:
  - when: ['lib/core/**']
    include: ['test/core/**']                       # failure_retry_policy ledger
  - when: ['lib/routing/**']
    include: ['test/routing/**']                    # navigation_links NL-R01c
  - when: ['lib/core/network/**', 'lib/features/auth/data/**']
    include: ['test/core/network/**', 'test/features/auth/data/**']   # kPiiPaths
  - when: ['lib/**']                                # servicesListProvider consumers
    when_text: 'servicesListProvider'               # only if the changed file mentions it
    include: ['test/features/services/**']

# Any Added/Deleted/Renamed file under these roots re-runs the meta tests that
# enumerate the tree (workflow wiring, guard wiring, integration aggregators).
structural_roots: ['lib/**', 'test/**', 'integration_test/**']
structural_include:
  - 'test/ci/**'
  - 'test/build_guards/**'
  - 'test/consistency/**'
  - 'test/integration_aggregator_meta_test.dart'
  - 'test/patrol_excluded_from_fast_path_test.dart'

# Tests that read lib/ source as text (dart:io readers) are always included
# once any lib/ file changed. Auto-detected: a string literal starting 'lib/ or "lib/.
always_include_when_changed: 'lib/**'
always_include_literal: '[''"]lib/'

# Third/fourth-timezone sweeps (pr-validate.yml "Third-timezone sweep" and
# "Fourth-timezone sweep"; the two lists are kept identical there) + DST rail.
tz_sweep:
  dirs:
    - test/features/booking/
    - test/features/schedule/
    - test/features/home/
    - test/features/calendar/
    - test/shared/formatters/
    - test/shared/time/
    - test/shared/calendar/
    - test/core/time/
    - test/routing/
  files:
    - test/features/booking/presentation/bookings_day_rail_test.dart

# Integration flows: top-level integration_test/*_test.dart (patrol/ and perf/
# are subdirectories, so excluded by construction).
integration:
  flow_glob: 'integration_test/*_test.dart'
  # Traversal does not follow edges INTO hubs (every flow reaches all of lib/
  # through the app harness); a changed hub selects ALL flows.
  hubs:
    - 'lib/main.dart'
    - 'lib/app.dart'
    - 'lib/routing/**'
    - 'integration_test/support/**'
    - 'test/integration_support/**'

# Unit tests selected above this share of all unit tests -> mode=full.
full_threshold: 0.60
