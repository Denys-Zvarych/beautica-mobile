# Dev VM is a 15 GiB VirtualBox guest with only a 2 GB swapfile and no zram —
# exceeding physical RAM here does not OOM-kill cleanly, it thrashes page cache
# into a freeze. Metaspace/code-cache are OFF-HEAP native allocations that stack
# ON TOP of -Xmx, they do not share it. Do not "helpfully" raise these back up;
# actual AGP metaspace usage for this project is ~300-500m.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Kotlin compile daemon is a SEPARATE JVM from the Gradle daemon above and sizes
# itself off available RAM when unset — pin it so total build memory is bounded.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
# 8 vCPU host also runs the desktop session; cap Gradle's worker executors so a
# build doesn't claim every core and starve the UI. 6 is a headroom guess (2
# cores left for the desktop), not a measured/benchmarked value.
# org.gradle.parallel is currently UNSET (defaults false), so today this only
# bounds Worker-API usage (annotation processors, some AGP/R8 sub-tasks,
# incremental Kotlin compile workers) — it does NOT limit whole-project
# parallel task execution, so it costs ~nothing right now. If
# org.gradle.parallel=true is ever added, this cap starts mattering for real
# (~25% throughput tax on 8 vCPU at 6) — re-evaluate then; 7 (losing one core,
# not two) is likely the right value in that case.
org.gradle.workers.max=6
android.useAndroidX=true
flutter.android.use-impeller=true

# Build time baseline (measured 2026-08-14, 15 GiB dev VM, cold daemons after
# `./gradlew --stop`, under the settings above):
#   flutter build apk --debug   -> 83.1s,  219 MB debug APK
#   flutter build apk --release -> 226.8s, ~71.8 MB release APK, R8 full mode
#   free -h before release build: 8.5 GiB free / 13 GiB available
# Compare future timings against this before concluding a build got slower.
