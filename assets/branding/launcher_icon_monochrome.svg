<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bloom Arc MONOCHROME (Android 13+ themed icons): bloom arcs + B as one solid black
       silhouette, transparent bg. The OS tints this shape with the user's wallpaper colour.
       Same 0.82 centre-scale as the foreground so the themed icon matches its footprint. -->
  <g transform="translate(512 512) scale(0.82) translate(-512 -512)">
    <g fill="none" stroke="#000000" stroke-linecap="round">
      <path d="M512 268 C 372 268 300 392 300 512" stroke-width="46"/>
      <path d="M512 320 C 624 320 700 408 700 512" stroke-width="46"/>
      <path d="M360 600 C 420 712 600 712 664 600" stroke-width="46"/>
    </g>
    <text x="512" y="580" font-family="'Cormorant Garamond', Georgia, serif" font-size="300" font-weight="600" fill="#000000" text-anchor="middle">B</text>
  </g>
</svg>
