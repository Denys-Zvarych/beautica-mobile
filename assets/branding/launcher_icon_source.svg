<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bloom Arc (concept 05): espresso bg + camel bloom arcs + centered cream serif "B".
       Master art transcribed from docs/signup-designs/app-icon-concepts.html (1024px render,
       B at y=580 / font-size 300). Renders with Cormorant Garamond; the consumed artifact is
       launcher_icon_source.png (rasterised on a machine with the font installed). -->
  <defs>
    <radialGradient id="espressoGlow" cx="32%" cy="26%" r="85%">
      <stop offset="0%" stop-color="#241509"/>
      <stop offset="100%" stop-color="#0D0906"/>
    </radialGradient>
    <linearGradient id="camelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdb190"/>
      <stop offset="100%" stop-color="#a8855f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="240" fill="url(#espressoGlow)"/>
  <g fill="none" stroke="url(#camelGrad)" stroke-linecap="round">
    <path d="M512 268 C 372 268 300 392 300 512" stroke-width="46"/>
    <path d="M512 320 C 624 320 700 408 700 512" stroke-width="46"/>
    <path d="M360 600 C 420 712 600 712 664 600" stroke-width="46" opacity="0.85"/>
  </g>
  <text x="512" y="580" font-family="'Cormorant Garamond', Georgia, serif" font-size="300" font-weight="600" fill="#F5EDE0" text-anchor="middle">B</text>
</svg>
