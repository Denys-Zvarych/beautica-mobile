# Beautica Mobile — Dart analyzer configuration.
#
# Extends Google's `flutter_lints` rule set (the default for new Flutter
# projects) and layers on:
#   - Stricter defaults: const constructors, no `print()`, no unused imports.
#
# NO ANALYZER PLUGINS ARE CONFIGURED, deliberately (2026-08-18). This file
# used to declare `plugins: - custom_lint` to host `riverpod_lint`. That host
# was archived upstream 2026-03-24 and riverpod_lint had already left it in
# 3.1.0, so it loaded zero plugins and still exited 0 — it gated nothing.
# Re-homing riverpod_lint on Dart's native analyzer-plugin path was then
# tried and abandoned: the rules DO fire there, but their diagnostics cannot
# be suppressed by ANY mechanism on this toolchain (`// ignore:`,
# `// ignore_for_file:`, `analyzer: errors: <rule>: ignore`, and
# `linter: rules: <rule>: false` were each tested and each is inert), which
# makes it unusable under CI's `--fatal-infos --fatal-warnings`. Full
# rationale and the revisit condition live in pubspec.yaml's lints block.
#
# Generated code (`api/**`, `*.g.dart`, `*.freezed.dart`) is excluded
# from analysis — they live under `pubspec.yaml`'s codegen umbrella and are
# regenerated, never hand-edited.
#
# Phase 1.2 — spacing scale enforcement (CI-side grep gate):
#   `EdgeInsets.(all|symmetric|fromLTRB)(<numeric literal>)` is forbidden
#   anywhere under `lib/` outside the `AppSpacing.*` tokens. The check runs
#   as the "Forbid magic padding numbers" step in
#   `.github/workflows/pr-validate.yml`. The Dart analyzer has no first-
#   class lint for this today. Numeric padding in
#   `lib/features/**` is an automatic `mobile-qa` HIGH finding.

# SECURITY: SharedPreferences is forbidden for auth tokens.
# Enforced by CI grep: grep -rE "SharedPreferences|shared_preferences" lib/features/auth/ must return 0 matches.
# See: mobile-security invariant, Phase 2.1.

# 2026-06-18 — Riverpod cycle-bug safeguards (CI-side grep gates):
#   - scripts/forbid_provider_self_invalidation.sh: no un-annotated cross-provider
#     ref.invalidate()/ref.refresh() inside lib/**/*notifier*.dart (footgun:
#     debug-only CircularDependencyError). Unblock a proven-safe call with a
#     `// cycle-safe: <reason>` comment.
#   - scripts/forbid_cycle_stub_in_tests.sh: notifier/integration tests must not
#     stub the cycle-closing providers (masterProfile/servicesList/
#     serviceRepository) — that hides the cycle. Unblock a justified stub with a
#     `// cycle-stub-ok: <reason>` comment.
# Both run in the pr-validate.yml `validate` job. Rationale: ARCHITECTURE-mobile.md § 14.3.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "api/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote a few high-signal lints to errors so they fail `flutter analyze
    # --fatal-warnings` in CI rather than rotting as warnings.
    prefer_const_constructors: error
    avoid_print: error
    unused_import: error

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
    avoid_relative_lib_imports: true
    unawaited_futures: true
    use_super_parameters: true
    sort_pub_dependencies: false

# `no_raw_ui_strings` is NOT an analyzer rule — it is a shell guard.
# See scripts/forbid_raw_ui_strings.sh (CI hard-gate + local runner).
