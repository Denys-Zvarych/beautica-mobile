# Beautica Mobile — Dart analyzer configuration.
#
# Extends Google's `flutter_lints` rule set (the default for new Flutter
# projects) and layers on:
#   - `custom_lint` runner enabling `riverpod_lint` (compile-time provider
#     validation — used after Phase 1 introduces `@riverpod` notifiers).
#   - Stricter defaults: const constructors, no `print()`, no unused imports.
#
# Generated code (`lib/api/**`, `*.g.dart`, `*.freezed.dart`) is excluded
# from analysis — they live under `pubspec.yaml`'s codegen umbrella and are
# regenerated, never hand-edited.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "lib/api/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote a few high-signal lints to errors so they fail `flutter analyze
    # --fatal-warnings` in CI rather than rotting as warnings.
    prefer_const_constructors: error
    avoid_print: error
    unused_import: error
  plugins:
    - custom_lint

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
    avoid_relative_lib_imports: true
    unawaited_futures: true
    use_super_parameters: true
    sort_pub_dependencies: false
