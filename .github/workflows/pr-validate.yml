name: PR Validation

# Cosmetic + load-bearing: an irrelevant-label (noop) event is titled `label-noop ...`
# so ci-gate's mirror mode (tool/ci/mirror.sh) can exclude noop runs when it looks
# up the real run for the same head SHA.
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.event.label.name != 'run-patrol' && format('label-noop PR {0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    branches: [main, dev]
    # `labeled` lets the opt-in `run-patrol` / `full-ci` labels act on a PR.
    # Any OTHER label is a no-op: its own concurrency group + every job gated
    # on `github.event.action != 'labeled' || label in (full-ci, run-patrol)`.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, dev]
  # Phase 396: NO `schedule:` here; nightly.yml dispatches this workflow on dev.
  # why: docs/ci/README.md#triggers-no-schedule
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run was dispatched (nightly = dispatched by nightly.yml)'
        type: choice
        options: [manual, nightly]
        default: manual

# Least privilege by default: every job needs only to read the repo.
permissions:
  contents: read

# Phase 396 D4: only pull_request runs cancel; noop labels / dispatches get their own group.
# why: docs/ci/README.md#concurrency
concurrency:
  group: >-
    pr-validate-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}${{
    (github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.event.label.name != 'run-patrol' && '-noop')
    || (github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id))
    || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # plan (phase 397): owns the diff, the run mode (full | selective | none), the unit shards.
  # why: docs/ci/README.md#job-plan
  plan:
    name: Plan (mode + diff)
    runs-on: ubuntu-latest
    if: (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
    timeout-minutes: 10
    # Least privilege: read-only token, and no job in this workflow holds a
    # write-scoped token, so nothing here can be turned against the repo.
    permissions:
      contents: read
    outputs:
      # `sel` (below) is the ONE final verdict: it folds plan + guard + the
      # selector. No fallback to the planner's raw `selective`: an empty mode
      # reaches ci-gate as "unknown plan mode" => RED (fail closed).
      mode: ${{ steps.sel.outputs.mode }}
      native: ${{ steps.plan.outputs.native }}
      run_all: ${{ steps.sel.outputs.run_all }}
      selection_count: ${{ steps.sel.outputs.selection_count }}
      unit_count: ${{ steps.sel.outputs.unit_count }}
      golden_count: ${{ steps.sel.outputs.golden_count }}
      tz_count: ${{ steps.sel.outputs.tz_count }}
      # 1 iff the DST day-rail file is in the tz list (base-owned resolver):
      # tests-ran owes a tz-kyiv stream from this, not from PR-made events.
      kyiv_count: ${{ steps.sel.outputs.kyiv_count }}
      integration_count: ${{ steps.sel.outputs.integration_count }}
      # unit + golden + tz: what the test jobs run (tests-ran expectation).
      test_count: ${{ steps.sel.outputs.test_count }}
      # Phase 402 D2/D3/D3a: `unit` matrix JSON + shard count from base-owned shard_units.sh.
      # why: docs/ci/README.md#plan-unit-shards-output
      unit_shards: ${{ steps.shard.outputs.unit_shards || '[1]' }}
      unit_shard_count: ${{ steps.shard.outputs.unit_shard_count || '0' }}
      # tz-sweeps matrix (D1): the Kyiv DST leg only when its file can run.
      tz_zones: ${{ (steps.sel.outputs.mode == 'selective' && steps.sel.outputs.kyiv_count != '1') && '["tokyo","honolulu"]' || '["kyiv-dst","tokyo","honolulu"]' }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      # TRUST MODEL: planner + selector run from `trusted/` (BASE commit) against `pr/`.
      # why: docs/ci/README.md#plan-trust-model
      - name: Checkout trusted tooling (base commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          # Only the planner/gate scripts are needed from the base commit.
          sparse-checkout: tool/ci
          persist-credentials: false

      # Default ref = the same merge commit the other jobs test, so the diff
      # below is the diff of exactly the tree under test.
      - name: Checkout tree under test (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: pr
          # Full history is only needed for the PR merge-base diff.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
          persist-credentials: false

      - name: Resolve the checked-out commit
        id: tree
        shell: bash
        run: echo "sha=$(git -C pr rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute plan (planner from the BASE commit)
        id: plan
        shell: bash
        working-directory: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The commit actually checked out (merge ref on PRs), not
          # pull_request.head.sha: the diff must describe the tested tree.
          HEAD_SHA: ${{ github.event.pull_request.number && steps.tree.outputs.sha || '' }}
          # Phase 400: selection is live (a selective PR gets run_all=false).
          SELECTIVE_ENABLED: 'true'
          # Outside the PR tree: the PR controls every path (and symlink) under pr/.
          PLAN_OUT_DIR: ${{ runner.temp }}/ci
        run: |
          if [ -x "$GITHUB_WORKSPACE/trusted/tool/ci/plan.sh" ]; then
            "$GITHUB_WORKSPACE/trusted/tool/ci/plan.sh"
          else
            # Bootstrap only (the PR that introduces the planner): the base has
            # none, so refuse to run the PR's copy and run everything.
            echo "::warning::base commit has no tool/ci/plan.sh; forcing mode=full"
            {
              echo "mode=full"; echo "native=true"; echo "run_all=true"
              echo "selection_count=unknown"; echo "base=$BASE_SHA"; echo "head=$HEAD_SHA"
            } | tee -a "$GITHUB_OUTPUT"
          fi

      # Base-owned tool/ci/ci_paths_guard.sh (D14): a CI-machinery change forces FULL, a forbidden
      # path fails the plan. Base lacks it (bootstrap): never run the PR copy, force FULL (warned).
      # why: docs/ci/README.md#plan-guard
      - name: Guard - CI machinery changes force full
        id: guard
        if: github.event_name == 'pull_request'
        shell: bash
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ steps.tree.outputs.sha }}
        run: |
          g="$GITHUB_WORKSPACE/trusted/tool/ci/ci_paths_guard.sh"
          if [ -f "$g" ]; then
            bash "$g"
          else
            # Bootstrap only (the PR that introduces the guard): the base has
            # none, so refuse to run the PR's copy and run everything.
            echo "::warning::ci_paths_guard bootstrap: base lacks the script, forcing full"
            { echo "mode=full"; echo "run_all=true"; } | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Upload changed-file list
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ci-changes
          path: ${{ runner.temp }}/ci/changes.txt
          retention-days: 3
          if-no-files-found: ignore

      # Phase 400 D1/D8 + 402 D10: uncached selector Dart from trusted/ on EVERY plan; a failure
      # is tolerated in FULL mode only (degrades to ["whole"]). Pinned in workflow_wiring_test.
      # why: docs/ci/README.md#plan-selector-setup
      - name: Set up Dart (selector)
        continue-on-error: ${{ (steps.guard.outputs.mode || steps.plan.outputs.mode) == 'full' }}
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d  # v1.8.1
        with:
          sdk: '3.11.5'

      - name: Selector pub get (base commit)
        id: selpubget
        continue-on-error: ${{ (steps.guard.outputs.mode || steps.plan.outputs.mode) == 'full' }}
        shell: bash
        run: |
          # Bootstrap / D7: a missing or failed fetch never turns the job red (forces FULL).
          # why: docs/ci/README.md#plan-selector-pubget
          d="$GITHUB_WORKSPACE/trusted/tool/ci/affected_tests"
          if [ -f "$d/pubspec.yaml" ]; then
            (cd "$d" && dart pub get --enforce-lockfile) || echo "::warning::selector pub get failed; the selector will force mode=full (D7)"
          fi

      # The ONE final verdict (job outputs read only this). D7: any selector failure => full.
      # why: docs/ci/README.md#plan-select-verdict
      - name: Select tests (selector from the BASE commit)
        id: sel
        shell: bash
        env:
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          GUARD_MODE: ${{ steps.guard.outputs.mode }}
          MERGE_BASE: ${{ steps.plan.outputs.base }}
        run: |
          set -euo pipefail
          eff="${GUARD_MODE:-$PLAN_MODE}"
          full_now() {
            echo "::notice::test selection: full ($1)"
            {
              echo "mode=full"; echo "run_all=true"
              for k in unit_count golden_count tz_count integration_count selection_count test_count; do echo "$k=unknown"; done
              echo "kyiv_count=0"
            } | tee -a "$GITHUB_OUTPUT"
          }
          if [ "$eff" != "selective" ]; then full_now "plan/guard mode '${eff:-<empty>}'"; exit 0; fi
          trusted="$GITHUB_WORKSPACE/trusted/tool/ci"
          if [ ! -f "$trusted/affected_tests/bin/affected_tests.dart" ] || [ ! -f "$trusted/resolve_selection.sh" ]; then
            echo "::warning::base commit has no selector/resolver; forcing mode=full"
            full_now "bootstrap"; exit 0
          fi
          # Outside the PR tree (plan.sh already hardened $RUNNER_TEMP/ci).
          sel_dir="$RUNNER_TEMP/ci/sel"
          rm -rf "$sel_dir"; mkdir "$sel_dir"
          rc=0
          (cd "$trusted/affected_tests" && dart run bin/affected_tests.dart \
            --repo "$GITHUB_WORKSPACE/pr" \
            --changes "$RUNNER_TEMP/ci/changes.txt" \
            --base-ref "$MERGE_BASE" \
            --rules "$trusted/affected_tests/rules.yaml" \
            --out "$sel_dir/selection.json") || rc=$?
          bash "$trusted/resolve_selection.sh" "$rc" "$sel_dir/selection.json"

      # Phase 402 D2/D3/D3a: unit shard lists from base-owned shard_units.sh; never red.
      # why: docs/ci/README.md#plan-shard
      - name: Shard unit tests (script from the BASE commit)
        id: shard
        shell: bash
        env:
          SHARD_MODE: ${{ steps.sel.outputs.mode }}
          SHARD_UNIT_COUNT: ${{ steps.sel.outputs.unit_count }}
          SHARD_THRESHOLD: ${{ steps.sel.outputs.unit_warn_threshold }}
        run: |
          set -euo pipefail
          trusted="$GITHUB_WORKSPACE/trusted/tool/ci"
          if [ ! -f "$trusted/shard_units.sh" ]; then
            # Bootstrap only (the PR that introduces sharding): the base has no
            # script, so run the pre-sharding command on one job.
            echo "::warning::base commit has no tool/ci/shard_units.sh; unit tests run unsharded"
            { echo 'unit_shards=["whole"]'; echo 'unit_shard_count=1'; } | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          SHARD_SEL_DIR="$RUNNER_TEMP/ci/sel" \
          SHARD_SELECTOR_DIR="$trusted/affected_tests" \
          SHARD_REPO="$GITHUB_WORKSPACE/pr" \
          SHARD_RULES="$trusted/affected_tests/rules.yaml" \
          SHARD_OUT_DIR="$RUNNER_TEMP/ci/shards" \
            bash "$trusted/shard_units.sh"

      - name: Upload unit shard lists
        if: steps.shard.outputs.unit_shards != '["whole"]' && steps.shard.outputs.unit_shard_count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ci-unit-shards
          path: ${{ runner.temp }}/ci/shards/unit-*.txt
          retention-days: 3
          if-no-files-found: error

      - name: Upload test selection
        if: steps.sel.outputs.mode == 'selective' || steps.sel.outputs.mode == 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ci-selection
          path: ${{ runner.temp }}/ci/sel/
          retention-days: 3
          if-no-files-found: error

  # gates-fast (audit F1, phase 402): grep/awk-only guards, no Flutter/Dart/Java (~1 min).
  # why: docs/ci/README.md#job-gates-fast
  gates-fast:
    name: Static guards (no Flutter)
    runs-on: ubuntu-latest
    if: (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # Phase 1.2: every padding literal uses AppSpacing.*.
      # why: docs/ci/static-guards.md#magic-padding
      - name: Forbid magic padding numbers
        shell: bash
        run: ./scripts/forbid_magic_padding.sh

      # 2026-06-18: no un-annotated cross-provider invalidate/refresh inside notifiers.
      # why: docs/ci/static-guards.md#provider-self-invalidation
      - name: Forbid un-annotated provider self-invalidation
        shell: bash
        run: ./scripts/forbid_provider_self_invalidation.sh

      # 2026-06-18: no stubs of the cycle-closing providers in notifier/integration tests.
      # why: docs/ci/static-guards.md#cycle-stub-in-tests
      - name: Forbid cycle-closing-provider stubs in notifier/integration tests
        shell: bash
        run: ./scripts/forbid_cycle_stub_in_tests.sh

      # 2026-06-18: self-test of the two cycle-guard gates above.
      # why: docs/ci/static-guards.md#cycle-gates-self-test
      - name: Self-test cycle-guard gates
        shell: bash
        run: ./scripts/test/test_cycle_gates.sh

      # Perf measurement scripts (startup / jank / download size) — hermetic
      # behavioural suites: fake adb/flutter/java/curl/git stubs on PATH, no
      # device, no network, no Flutter build. Run from scripts/perf/tests/.
      - name: Self-test perf measurement scripts
        shell: bash
        run: |
          set -e
          for t in scripts/perf/tests/*.test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      # 2026-06-24: CLIENT branch-root screens reuse ClientTopBar, no per-screen AppBar.
      # why: docs/ci/static-guards.md#client-branch-appbar
      - name: Forbid AppBar in CLIENT branch-root screens
        shell: bash
        run: ./scripts/forbid_client_branch_appbar.sh

      # 2026-06-24: no Cyrillic find.text finders in tests (ratchet allow-list).
      # why: docs/ci/static-guards.md#cyrillic-finder
      - name: Forbid Cyrillic find.text finders in tests
        shell: bash
        run: ./scripts/forbid_cyrillic_finder.sh

      # 2026-06-24: no fixed-duration pump waits in tests (ratchet allow-list).
      # why: docs/ci/static-guards.md#fixed-wait
      - name: Forbid fixed-duration pump waits in tests
        shell: bash
        run: ./scripts/forbid_fixed_wait.sh

      # Phase 361 audit (perf P2): header-importing tests use makeTestContainer.
      # why: docs/ci/static-guards.md#raw-container-with-header
      - name: Forbid raw ProviderContainer in header-importing tests
        shell: bash
        run: ./scripts/forbid_raw_container_with_header.sh

      # Phase 066 — Firebase client config (google-services.json /
      # GoogleService-Info.plist) is injected at build time and must never be
      # tracked by git (the repo is public). `git add -f` bypasses .gitignore.
      - name: Forbid tracked Firebase client config
        shell: bash
        run: ./scripts/forbid_google_services_json.sh

      # 2026-06-24: a ServiceForm test must override approvedCategoriesProvider.
      # why: docs/ci/static-guards.md#unmocked-approved-categories
      - name: Forbid unmocked approvedCategoriesProvider in ServiceForm tests
        shell: bash
        run: ./scripts/forbid_unmocked_approved_categories.sh

      # 2026-07-10: no inline fontSize under lib/features (VelvetText tokens only).
      # why: docs/ci/static-guards.md#inline-fontsize
      - name: Forbid inline fontSize under lib/features (VelvetText tokens only)
        shell: bash
        run: ./scripts/forbid_inline_fontsize.sh

      # 2026-10-03 phase 077 F3 — only Comfortaa w600/w700 and Nunito
      # w400/w600/w700/w800 are bundled; FontWeight.w100/200/300/500/900 in
      # lib/ renders at the wrong weight (no face to resolve).
      - name: Forbid unbundled FontWeight under lib (bundled weights only)
        shell: bash
        run: ./scripts/forbid_unbundled_font_weight.sh

      # Phase 075 — no assignment of debug hooks in lib/ (production code).
      - name: Forbid debug-hook assignment in lib
        shell: bash
        run: ./scripts/forbid_debug_hook_assignment_in_lib.sh

      # Phase 076 — raw Image.network / NetworkImage is banned; use the shared cached image widget.
      - name: Forbid raw network image
        shell: bash
        run: ./scripts/forbid_raw_network_image.sh

      # 2026-07-19: tests read the location via AppHarness, never currentConfiguration.
      # why: docs/ci/static-guards.md#naive-router-location
      - name: Forbid naive currentConfiguration.uri/.fullPath reads in tests
        shell: bash
        run: ./scripts/forbid_naive_router_location.sh

      # Phase 7.1 P4 / 7.9: BookingsDayQuery.masterOwn only in its declaring file.
      # why: docs/ci/static-guards.md#raw-bookings-query
      - name: Forbid BookingsDayQuery.masterOwn outside its declaring file
        shell: bash
        run: ./scripts/forbid_raw_bookings_query.sh

      # 2026-07-20/21: no stale absolute future-date fixtures in booking + E2E tests.
      # why: docs/ci/static-guards.md#stale-future-date
      - name: Forbid stale absolute future-date fixtures in booking + E2E tests
        shell: bash
        run: ./scripts/forbid_stale_future_date_fixture.sh

      # 2026-08-02: zone-critical tests pin DateTime.utc / TZDateTime, never host-local.
      # why: docs/ci/static-guards.md#host-local-instant-anchor
      - name: Forbid host-local instant anchors in zone-critical tests
        shell: bash
        run: ./scripts/forbid_host_local_instant_anchor.sh

      # 2026-08-02: every DateTime.now under lib/ carries `// instant-ok:` (ARCH § 0.9).
      # why: docs/ci/static-guards.md#raw-clock-read
      - name: Forbid un-annotated raw clock reads in production code
        shell: bash
        run: ./scripts/forbid_raw_clock_read.sh

      # 2026-07-22: integration harnesses register the test text-input mock.
      # why: docs/ci/static-guards.md#missing-test-text-input
      - name: Forbid missing testTextInput.register() in integration harnesses
        shell: bash
        run: ./scripts/forbid_missing_test_text_input.sh

      # 2026-07-22: no vacuous expectLocation(..., RouteNames.home).
      # why: docs/ci/static-guards.md#expectlocation-home
      - name: Forbid vacuous expectLocation(..., RouteNames.home) assertions
        shell: bash
        run: ./scripts/forbid_expectlocation_home.sh

      # 2026-07-22: no '/' in a patrolTest description (kills the orchestrator).
      # why: docs/ci/static-guards.md#slash-in-patrol-test-name
      - name: Forbid slashes in patrol test names
        shell: bash
        run: ./scripts/forbid_slash_in_patrol_test_name.sh

      # Phase 396 — pr-validate.yml must never regain a `schedule:` trigger (or a
      # schedule-conditional checkout ref): schedule runs use main's workflow
      # with dev's code and the skew broke patrol four nights running.
      - name: Forbid schedule coupling in pr-validate.yml
        shell: bash
        run: ./scripts/forbid_schedule_in_pr_validate.sh

      # 2026-07-31: no bare pumpAndSettle right after a results-screen tap.
      # why: docs/ci/static-guards.md#results-bare-pump-and-settle
      - name: Forbid bare pumpAndSettle after a results-screen tap
        shell: bash
        run: ./scripts/forbid_results_bare_pump_and_settle.sh

      # 2026-07-31: no raw casts on queryParameters reads in test fakes.
      # why: docs/ci/static-guards.md#raw-query-param-cast
      - name: Forbid raw casts on queryParameters reads in test fakes
        shell: bash
        run: ./scripts/forbid_raw_query_param_cast.sh

      # 2026-07-31: enabled calendar-day taps go through tester.tapCalendarDay.
      # why: docs/ci/static-guards.md#blind-calendar-tap
      - name: Forbid blind taps on calendar day cells
        shell: bash
        run: ./scripts/forbid_blind_calendar_tap.sh

      # 2026-07-31: each CLIENT shell branch screen keeps its client-branch-<slug> Key.
      # why: docs/ci/static-guards.md#client-branch-key
      - name: Forbid a client shell branch screen missing its branch Key
        shell: bash
        run: ./scripts/forbid_missing_client_branch_key.sh

      # 2026-08-22: tab-root titles stay on VelvetText.pageTitle; no new title token.
      # why: docs/ci/static-guards.md#page-title-token-fork
      - name: Forbid a page-title VelvetText token fork
        shell: bash
        run: ./scripts/forbid_page_title_token_fork.sh

      # 2026-08-14: one shared calendar-grid implementation (mobile-backlog D5).
      # why: docs/ci/static-guards.md#forked-calendar-grid
      - name: Forbid a forked calendar-grid implementation
        shell: bash
        run: ./scripts/forbid_forked_calendar_grid.sh

      # Phase 271 D5: the deleted per-master salon submit notifier stays deleted.
      # why: docs/ci/static-guards.md#salon-booking-submit-notifier
      - name: Forbid the deleted per-master salon booking submit notifier
        shell: bash
        run: ./scripts/forbid_salon_booking_submit_notifier.sh

      # 2026-09-10 (phase 317): scoped-services providers declare `dependencies:`.
      # why: docs/ci/static-guards.md#undeclared-scoped-service-dep
      - name: Forbid an undeclared scoped-services provider dependency
        shell: bash
        run: ./scripts/forbid_undeclared_scoped_service_dep.sh

      # 2026-09-17 (mobile-security S-L2): hand-built /api/v1 paths encode every id.
      # why: docs/ci/static-guards.md#unencoded-path-interpolation
      - name: Forbid unencoded interpolation into a hand-built API path
        shell: bash
        run: ./scripts/forbid_unencoded_path_interpolation.sh

      # Phase 348 INFO-1: the generated-enum fallback is read only in api_enum_names.dart.
      # why: docs/ci/static-guards.md#api-enum-fallback
      - name: Forbid reading the generated-enum fallback outside api_enum_names
        shell: bash
        run: ./scripts/forbid_api_enum_fallback.sh

      # Phase 300: every layer-opacity site is `dim-gated:` or `dim-decorative:`.
      # why: docs/ci/static-guards.md#unclassified-layer-dim
      - name: Forbid unclassified layer-opacity dims
        shell: bash
        run: ./scripts/forbid_unclassified_layer_dim.sh

      # Phase 300: end-to-end harness for the layer-dim guard above.
      # why: docs/ci/static-guards.md#layer-dim-harness
      - name: Self-test layer-dim guard (harness)
        shell: bash
        run: ./scripts/test/test_layer_dim_guard.sh

      # Phase 076 — end-to-end harness for the raw-network-image guard.
      - name: Self-test raw-network-image guard (harness)
        shell: bash
        run: ./scripts/test/test_raw_network_image_guard.sh

      # Phase 1.4: go_router-only navigation in lib/features; comment-only lines skipped.
      # why: docs/ci/static-guards.md#direct-navigator
      - name: Forbid direct Navigator usage in features
        run: |
          MATCHES=$(grep -rnE 'Navigator\.(push|pop|of)\b' lib/features/ 2>/dev/null | awk -F: '
            {
              content = $0
              sub(/^[^:]*:[0-9]+:/, "", content)
              trimmed = content
              sub(/^[ \t]*/, "", trimmed)
              if (trimmed !~ /^(\/\/|\/\*|\*)/) print $0
            }
          ') || true
          if [ -n "$MATCHES" ]; then
            echo 'Direct Navigator usage found in lib/features/ — use context.go(RouteNames.x) instead'
            echo "$MATCHES"
            exit 1
          fi

      # MS1: no SharedPreferences in lib/features (flutter_secure_storage only).
      # why: docs/ci/static-guards.md#shared-preferences
      - name: Forbid SharedPreferences in features (MS1)
        run: |
          MATCHES=$(grep -rE "SharedPreferences|shared_preferences" lib/features/ 2>/dev/null | grep -v "^\s*//") || true
          if [ -n "$MATCHES" ]; then
            echo "SharedPreferences found in lib/features/ — use SecureStorage instead"
            echo "$MATCHES"
            exit 1
          fi

  # gates (phase 402 D1; was `validate`): codegen, OpenAPI --check, format, analyze and the
  # guards that need Flutter or *.g.dart. Starts at once (needs nothing).
  # why: docs/ci/README.md#job-gates
  gates:
    name: Analyze & Gates
    runs-on: ubuntu-latest
    if: (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Phase 402 D5: Flutter 3.41 + pub cache + pub get + build_runner, shared
      # with every other app job. (*.g.dart are gitignored; codegen must run on
      # every fresh checkout before analyze/test can succeed.)
      - name: Set up Flutter, pub get, codegen
        uses: ./.github/actions/flutter-setup
        # Self-test's selector pub get lands in this same pub cache; key it on the selector lock too.
        # why: docs/ci/README.md#gates-selector-pub-cache
        with:
          extra-pub-key-files: tool/ci/affected_tests/pubspec.lock
      # Phase 3.1: OpenAPI drift gate (regenerate from the committed spec, diff api/).
      # why: docs/ci/static-guards.md#openapi-drift
      - name: Install openapi-generator-cli
        # Pinned to 6.1.0 (wraps JAR 7.9.0) — must match scripts/regenerate_api.sh.
        # Update both locations together to avoid spec-drift between local and CI.
        run: dart pub global activate openapi_generator_cli 6.1.0

      - name: Verify built_value codegen is internally consistent
        # Incident 2026-07-02: built_value codegen consistency, before the slower JAR check.
        # why: docs/ci/static-guards.md#builtvalue-codegen
        run: ./scripts/verify_builtvalue_codegen.sh

      - name: Verify OpenAPI client is up to date
        # Fix 3 (2026-06-02) drift gate; 10 min step timeout since PR #73 (JAR download stall).
        # why: docs/ci/static-guards.md#openapi-check-timeout
        timeout-minutes: 10
        run: ./scripts/regenerate_api.sh --check

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # 2026-08-18: the custom_lint step was deleted (it loaded zero plugins); no lint plugin today.
      # why: docs/ci/static-guards.md#custom-lint-removed

      # 2026-08-18: AST-based no_raw_ui_strings gate (runs dart; shrink-only allow-list).
      # why: docs/ci/static-guards.md#raw-ui-strings
      - name: Forbid raw user-visible string literals under lib/
        shell: bash
        run: ./scripts/forbid_raw_ui_strings.sh

      # 2026-08-21: no bare keepAlive-family cross-invalidation (reads *.g.dart).
      # why: docs/ci/static-guards.md#keepalive-family-invalidation
      - name: Forbid a bare keepalive-family cross-invalidation
        shell: bash
        run: ./scripts/forbid_bare_keepalive_family_invalidation.sh

      # Self-test every scripts/forbid_*.sh: glob discovery + sentinel per guard.
      # why: docs/ci/static-guards.md#verify-guards-self-test
      - name: Self-test drift-prevention gates
        shell: bash
        run: ./scripts/verify_guards.sh --self-test


  # Selector tests (phase 400 L1, audit F6): required, uncached (D8); 3 tag legs.
  # why: docs/ci/README.md#job-selector-tests
  selector-tests:
    name: Selector tests (${{ matrix.leg }})
    runs-on: ubuntu-latest
    if: (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
    timeout-minutes: 30  # phase 402: a ceiling (D9), not a budget
    strategy:
      fail-fast: false
      matrix:
        leg: [fast, e2e-a, e2e-b]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # The parity test needs the pre-400 commit: fetch exactly it. A failed fetch is RED.
      # why: docs/ci/README.md#selector-tests-pre400-fetch
      - name: Fetch pre-400 parity commit
        shell: bash
        run: git fetch --no-tags --depth=1 origin 7b85cb18c809319fa1fd8519349e307dc9498cf4

      - name: Set up Dart (selector tests)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d  # v1.8.1
        with:
          sdk: '3.11.5'

      - name: Selector dart test
        shell: bash
        working-directory: tool/ci/affected_tests
        env:
          LEG: ${{ matrix.leg }}
        run: |
          set -euo pipefail
          dart pub get --enforce-lockfile
          case "$LEG" in
            fast) dart test --concurrency="$(nproc)" -x e2e ;;
            e2e-a | e2e-b) dart test --concurrency="$(nproc)" -t "$LEG" ;;
            *) echo "unknown selector-tests leg '$LEG'"; exit 1 ;;
          esac

  # Test split (phase 402 D1): unit / tz-sweeps / goldens / apk in parallel, `needs: plan`.
  # unit (D2/D3/D3a): file-level shards from `plan` via run_list.sh; tests-ran re-proves them.
  # why: docs/ci/README.md#job-unit
  unit:
    name: Unit tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: plan
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
      && (needs.plan.outputs.mode == 'full' || (needs.plan.outputs.mode == 'selective' && needs.plan.outputs.unit_count != '0'))
    # A shard is ~6 min of tests + ~3 min of setup; the ["whole"] fallback is the
    # old ~28 min single run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.unit_shards || '[1]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Flutter, pub get, codegen
        uses: ./.github/actions/flutter-setup

      # Full + selective: the shard lists `plan` wrote. Outside the tree, like
      # the other selection downloads. Not needed for the ["whole"] fallback.
      - name: Download unit shard lists
        if: matrix.shard != 'whole'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ci-unit-shards
          path: ${{ runner.temp }}/shards

      # Per-shard parity with the pre-sharding step; the "whole" branch is the pre-400 command.
      # why: docs/ci/README.md#unit-test-step
      - name: Test
        shell: bash
        env:
          CI_MODE: ${{ needs.plan.outputs.mode }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = "whole" ]; then
            mkdir -p build/ci
            flutter test --coverage --reporter=expanded --file-reporter=json:build/ci/unit-events.json --exclude-tags golden
          else
            flags=(--exclude-tags golden)
            if [ "$CI_MODE" = "full" ]; then flags=(--coverage "${flags[@]}"); fi
            bash tool/ci/run_list.sh "$RUNNER_TEMP/shards/unit-shard-$SHARD.txt" "unit-$SHARD-events" "${flags[@]}"
          fi

      # The tests-ran verdict is NOT computed here (PR code runs here); always() hands it over.
      # why: docs/ci/README.md#unit-events-handoff
      - name: Upload unit event stream
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: events-unit-${{ matrix.shard }}
          path: build/ci/*-events.json
          retention-days: 3
          if-no-files-found: ignore

      # D4: each full shard hands its lcov to the `coverage` job (merged there).
      - name: Upload shard coverage
        if: success() && needs.plan.outputs.run_all == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: lcov-unit-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 3
          if-no-files-found: error

  # tz-sweeps (D1): one leg per zone; the zone steps keep names, STEP-level TZ, commands.
  # why: docs/ci/tz-sweeps.md#job-tz-sweeps
  tz-sweeps:
    name: TZ sweep (${{ matrix.zone }})
    runs-on: ubuntu-latest
    needs: plan
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
      && (needs.plan.outputs.mode == 'full' || (needs.plan.outputs.mode == 'selective' && needs.plan.outputs.tz_count != '0'))
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        zone: ${{ fromJSON(needs.plan.outputs.tz_zones || '["tokyo"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Flutter, pub get, codegen
        uses: ./.github/actions/flutter-setup

      # Selective mode only: the plan job's lists (unit.txt, golden.txt,
      # tz_sweep.txt, integration.txt). Outside the tree, like plan's output.
      - name: Download test selection
        if: needs.plan.outputs.mode == 'selective'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ci-selection
          path: ${{ runner.temp }}/sel

      # Kyiv DST leg: the rail's rendered DST guards execute only under the market zone.
      # STEP-level TZ only (unit shards stay UTC). Pinned by test/ci/dst_rail_ci_coverage_test.dart.
      # why: docs/ci/tz-sweeps.md#dst-rail
      - name: DST rail guards (market zone)
        if: matrix.zone == 'kyiv-dst'
        shell: bash
        env:
          TZ: Europe/Kyiv
          CI_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          if [ "$CI_MODE" = "full" ]; then
            flutter test test/features/booking/presentation/bookings_day_rail_test.dart --reporter=expanded
          elif grep -qFx test/features/booking/presentation/bookings_day_rail_test.dart "$RUNNER_TEMP/sel/tz_sweep.txt"; then
            printf '%s\n' test/features/booking/presentation/bookings_day_rail_test.dart >"$RUNNER_TEMP/sel/tz_kyiv.txt"
            bash tool/ci/run_list.sh "$RUNNER_TEMP/sel/tz_kyiv.txt" tz-kyiv-events
          else
            echo "day-rail file not in the selection; nothing to run under Europe/Kyiv"
          fi

      # Asia/Tokyo (2026-08-02): host-clock leak detector, no DST, directory-level scope.
      # STEP-level TZ only; pinned by test/ci/dst_rail_ci_coverage_test.dart.
      # why: docs/ci/tz-sweeps.md#tokyo
      - name: Third-timezone sweep (host-clock leak detector)
        if: matrix.zone == 'tokyo'
        shell: bash
        env:
          TZ: Asia/Tokyo
          CI_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          if [ "$CI_MODE" = "full" ]; then
          flutter test \
            test/features/booking/ \
            test/features/schedule/ \
            test/features/home/ \
            test/features/calendar/ \
            test/shared/formatters/ \
            test/shared/time/ \
            test/shared/calendar/ \
            test/core/time/ \
            test/routing/ \
            --reporter=expanded
          else
            bash tool/ci/run_list.sh "$RUNNER_TEMP/sel/tz_sweep.txt" tz-tokyo-events
          fi

      # Pacific/Honolulu (2026-08-04): west of Kyiv, catches an hour band Tokyo cannot.
      # Directory list identical to Tokyo's; STEP-level TZ only (dst_rail_ci_coverage_test).
      # why: docs/ci/tz-sweeps.md#honolulu
      - name: Fourth-timezone sweep (west-of-Kyiv day-boundary detector)
        if: matrix.zone == 'honolulu'
        shell: bash
        env:
          TZ: Pacific/Honolulu
          CI_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          if [ "$CI_MODE" = "full" ]; then
          flutter test \
            test/features/booking/ \
            test/features/schedule/ \
            test/features/home/ \
            test/features/calendar/ \
            test/shared/formatters/ \
            test/shared/time/ \
            test/shared/calendar/ \
            test/core/time/ \
            test/routing/ \
            --reporter=expanded
          else
            bash tool/ci/run_list.sh "$RUNNER_TEMP/sel/tz_sweep.txt" tz-honolulu-events
          fi

      # Streams from run_list.sh (selective only; full runs print to the console
      # as before). tests-ran judges them stream by stream.
      - name: Upload tz event streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: events-tz-${{ matrix.zone }}
          path: build/ci/*-events.json
          retention-days: 3
          if-no-files-found: ignore

  goldens:
    name: Golden regression tests
    runs-on: ubuntu-latest
    needs: plan
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
      && (needs.plan.outputs.mode == 'full' || (needs.plan.outputs.mode == 'selective' && needs.plan.outputs.golden_count != '0'))
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Flutter, pub get, codegen
        uses: ./.github/actions/flutter-setup

      # Selective mode only: the plan job's lists (unit.txt, golden.txt,
      # tz_sweep.txt, integration.txt). Outside the tree, like plan's output.
      - name: Download test selection
        if: needs.plan.outputs.mode == 'selective'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ci-selection
          path: ${{ runner.temp }}/sel

      # Phase 17.4: alchemist CI goldens vs test/golden/goldens/; diffs uploaded on failure.
      # why: docs/ci/README.md#goldens-step
      - name: Golden regression tests
        shell: bash
        env:
          CI_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          if [ "$CI_MODE" = "full" ]; then
            flutter test test/golden/ --reporter=expanded
          else
            bash tool/ci/run_list.sh "$RUNNER_TEMP/sel/golden.txt" golden-events
          fi

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: golden-failure-diffs-${{ github.event.pull_request.number || github.run_number }}
          # All golden tests live directly under test/golden/, so alchemist only
          # ever writes test/golden/failures/. The recursive **/failures/ glob
          # matched nothing and was removed (PERF INFO).
          path: |
            test/golden/failures/
          if-no-files-found: ignore

      - name: Upload golden event stream
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: events-golden
          path: build/ci/*-events.json
          retention-days: 3
          if-no-files-found: ignore

  # apk (D1, phase 400 D4/D5, audit F5): debug | release legs; full mode or native PR.
  # why: docs/ci/README.md#job-apk
  apk:
    name: Build APKs (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # Audit cycle 2 N2: `gates-fast` is an ordering-only dependency (runner cap).
    # why: docs/ci/README.md#apk-needs-gates-fast
    needs: [plan, gates-fast]
    # Audit cycle 2 N-L2: signing secrets live in `ci-trusted-secrets`; only the release leg
    # off pull_request names it. One-time setup: phase doc 402.
    # why: docs/ci/README.md#apk-environment
    environment: ${{ (github.event_name != 'pull_request' && matrix.variant == 'release') && 'ci-trusted-secrets' || '' }}
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
      && (needs.plan.outputs.mode == 'full' || needs.plan.outputs.native == 'true')
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # Java is only for the Gradle APK builds below.
      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter, pub get, codegen
        uses: ./.github/actions/flutter-setup

      # Decode the release keystore: NEVER on pull_request (security audit 2026-10-10).
      # why: docs/ci/README.md#apk-keystore
      - name: Decode keystore
        if: github.event_name != 'pull_request' && matrix.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.BEAUTICA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode \
              > "$GITHUB_WORKSPACE/beautica-release.jks"
            echo "Keystore decoded ✅"
          else
            echo "BEAUTICA_KEYSTORE_BASE64 not set — skipping release signing"
          fi

      # Phase 400 D4: the APK builds prove native packaging, not Dart logic.
      # why: docs/ci/README.md#apk-build-debug
      - name: Build APK (debug)
        if: matrix.variant == 'debug'
        env:
          # NO /api/v1 suffix (double prefix -> 404); pinned by app_config_path_test.dart.
          # why: docs/ci/README.md#apk-base-url
          BEAUTICA_BASE_URL: https://beautica-backend-production.up.railway.app
        run: |
          flutter build apk --debug \
            --dart-define=BEAUTICA_BASE_URL="$BEAUTICA_BASE_URL"

      # PRs: compile-only release build, NO secrets (debug key, never distributed).
      # why: docs/ci/README.md#apk-release-compile-check
      - name: Build APK (release, compile check, no secrets)
        if: github.event_name == 'pull_request' && matrix.variant == 'release'
        env:
          BEAUTICA_BASE_URL: https://beautica-backend-production.up.railway.app
          BEAUTICA_ALLOW_DEBUG_SIGNED_RELEASE: '1'
        run: |
          flutter build apk --release \
            --dart-define=BEAUTICA_BASE_URL="$BEAUTICA_BASE_URL"

      - name: Build APK (release, signed)
        if: github.event_name != 'pull_request' && matrix.variant == 'release'
        env:
          # NO /api/v1 suffix — see the debug build note above. Double-prefix → 404.
          BEAUTICA_BASE_URL: https://beautica-backend-production.up.railway.app
          BEAUTICA_KEYSTORE_PATH: ${{ github.workspace }}/beautica-release.jks
          BEAUTICA_KEYSTORE_PASSWORD: ${{ secrets.BEAUTICA_KEYSTORE_PASSWORD }}
          BEAUTICA_KEY_ALIAS: ${{ secrets.BEAUTICA_KEY_ALIAS }}
          BEAUTICA_KEY_PASSWORD: ${{ secrets.BEAUTICA_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=BEAUTICA_BASE_URL="$BEAUTICA_BASE_URL"

      # APK artifact uploads intentionally disabled (2026-07-06, storage quota).
      # why: docs/ci/README.md#apk-uploads-disabled

  # coverage (D4, audit F2): full mode only, merges shard lcov; NON-BLOCKING.
  # why: docs/ci/README.md#job-coverage
  coverage:
    name: Coverage (merge shards)
    runs-on: ubuntu-latest
    needs: [plan, unit]
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
      && needs.plan.outputs.run_all == 'true' && needs.unit.result == 'success'
    continue-on-error: true
    timeout-minutes: 15
    # Audit cycle 2 N-L2: CODECOV_TOKEN lives in `ci-trusted-secrets`; '' on pull_request.
    # why: docs/ci/README.md#coverage-environment
    environment: ${{ github.event_name != 'pull_request' && 'ci-trusted-secrets' || '' }}
    # Read-only token (S-L2): this job never writes to the repo or the API.
    permissions:
      contents: read

    steps:
      - name: Download shard coverage
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          pattern: lcov-unit-*
          path: lcov

      # Audit S-L3: lcov is pinned to the version `ubuntu-latest` (24.04, noble)
      # ships; apt fails the step if that exact version ever disappears, instead
      # of silently merging with another one. `lcov --version` is logged.
      - name: Merge shard coverage (lcov -a)
        shell: bash
        env:
          LCOV_VERSION: 2.0-4ubuntu2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "lcov=$LCOV_VERSION"
          lcov --version
          shopt -s nullglob
          files=(lcov/*/lcov.info)
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::no shard lcov.info to merge"; exit 1; fi
          args=()
          for f in "${files[@]}"; do args+=(-a "$f"); done
          mkdir -p coverage
          lcov "${args[@]}" -o coverage/lcov.info
          {
            echo "### Merged coverage (${#files[@]} shard file(s))"
            echo
            echo '```'
            lcov --summary coverage/lcov.info 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Audit N-L1: PR coverage is BEST-EFFORT (tokenless, fail_ci_if_error false); the
      # authoritative numbers are the dev / main runs. Phase 397 D5, audit S-L2.
      # why: docs/ci/README.md#coverage-upload
      - name: Upload coverage (pull_request, tokenless)
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage (push / dispatch, with token)
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          file: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Bootstrap bridge (phase 402): REMOVE once the base gate.sh checks the split jobs.
  # why: docs/ci/README.md#job-test-aggregate
  test:
    name: Test & Build (aggregate)
    runs-on: ubuntu-latest
    needs: [unit, tz-sweeps, goldens, apk]
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
    timeout-minutes: 5
    steps:
      - name: No split test job failed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" | jq -e 'to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | length == 0' >/dev/null

  # tests-ran (audit N2/N3, phase 402): a base-only checkout judges every event stream;
  # no PR checkout, read-only token, no secrets; fail closed.
  # why: docs/ci/README.md#job-tests-ran
  tests-ran:
    name: Tests actually ran
    runs-on: ubuntu-latest
    needs: [plan, unit, tz-sweeps, goldens]
    # Runs once the plan is sound and no test job failed; ci-gate separately
    # fails a failed job, and a skipped job owes its stream below.
    if: >-
      always() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
      && needs.plan.result == 'success' && needs.plan.outputs.mode != 'none'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout checker + floor (base commit only)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            tool/ci/tests_ran.sh
            tool/ci/verify_shards.sh
            tool/ci/collect_events.sh
            tool/ci/min_tests.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Audit S-L1: NOT merge-multiple; collect_events.sh takes one file per artifact.
      # why: docs/ci/README.md#tests-ran-download
      - name: Download event streams
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          pattern: events-*
          path: events-dl

      # The base-owned shard lists (written by `plan`); absent for ["whole"].
      - name: Download unit shard lists
        id: dlshards
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ci-unit-shards
          path: shards

      - name: Verify tests actually ran
        shell: bash
        env:
          RUN_ALL: ${{ needs.plan.outputs.run_all }}
          # unit + golden + tz lists: what the test jobs ran (phase 400).
          TEST_COUNT: ${{ needs.plan.outputs.test_count }}
          # Per-list sizes: every non-empty list owes its stream (QA INFO).
          UNIT_COUNT: ${{ needs.plan.outputs.unit_count }}
          GOLDEN_COUNT: ${{ needs.plan.outputs.golden_count }}
          TZ_COUNT: ${{ needs.plan.outputs.tz_count }}
          # 1 iff the Kyiv rail step ran (base-owned resolver verdict).
          KYIV_COUNT: ${{ needs.plan.outputs.kyiv_count }}
          # Phase 402: the unit matrix, base-owned (plan).
          UNIT_SHARDS: ${{ needs.plan.outputs.unit_shards }}
          UNIT_SHARD_COUNT: ${{ needs.plan.outputs.unit_shard_count }}
        run: |
          set -euo pipefail
          chk=tool/ci/tests_ran.sh
          vs=tool/ci/verify_shards.sh
          if [ ! -f "$chk" ]; then
            # Bootstrap only (the PR that introduces the checker): base has none.
            echo "::warning::base commit has no tool/ci/tests_ran.sh; skipping the tests-ran check"
            exit 0
          fi
          # Audit S-L1: per-artifact intake (see the download step). Bootstrap
          # only (the PR that introduces collect_events.sh): a base without it
          # keeps the old flat merge, loudly.
          col=tool/ci/collect_events.sh
          mkdir -p events
          if [ -f "$col" ]; then
            bash "$col" events-dl events || { echo "::error::tests-ran RED: an event artifact carries a file it may not (see above)"; exit 1; }
          else
            echo "::warning::base commit has no tool/ci/collect_events.sh; merging event artifacts flat (bootstrap)"
            shopt -s nullglob
            for f in events-dl/*/*-events.json; do cp "$f" events/; done
            shopt -u nullglob
          fi
          # The unit streams, full AND selective. ["whole"] = the unsharded
          # fallback (one stream, unit-events.json); otherwise N shard streams
          # that must partition the base-computed list (the count invariant).
          verify_unit() {
            if [ "$UNIT_SHARDS" = '["whole"]' ]; then
              if [ ! -s events/unit-events.json ]; then
                echo "::error::tests-ran RED: unit event stream missing or empty (fail closed)"; exit 1
              fi
              return 0
            fi
            if ! [[ "$UNIT_SHARD_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::tests-ran RED: unit_shard_count '$UNIT_SHARD_COUNT' is not a positive number (fail closed)"; exit 1
            fi
            if [ ! -f "$vs" ]; then
              echo "::error::tests-ran RED: base commit has no $vs but the unit tests were sharded (fail closed)"; exit 1
            fi
            bash "$vs" events shards "$UNIT_SHARD_COUNT" || { echo "::error::tests-ran RED: the unit shards do not add up (see above)"; exit 1; }
          }
          if [ "$RUN_ALL" = "true" ]; then
            verify_unit
            if [ "$UNIT_SHARDS" = '["whole"]' ]; then
              ev=events/unit-events.json
            else
              # Full: the SUM over all shards against the base-owned floor (never relaxed).
              # why: docs/ci/README.md#tests-ran-full-floor
              shopt -s nullglob
              : >events/unit-joined.ndjson
              for st in events/unit-*-events.json; do cat "$st" >>events/unit-joined.ndjson; done
              ev=events/unit-joined.ndjson
            fi
            bash "$chk" "$ev" full tool/ci/min_tests.txt
          elif [ "$TEST_COUNT" = "0" ]; then
            echo "empty test selection (mode none, or integration-only): nothing is expected to run"
          elif [[ "$TEST_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            # Selective: >= 1 real test passed PER stream; an all-skipped list is RED.
            # why: docs/ci/README.md#tests-ran-selective
            shopt -s nullglob
            streams=(events/*-events.json)
            if [ "${#streams[@]}" -eq 0 ]; then
              echo "::error::tests-ran RED: $TEST_COUNT test file(s) selected but no event stream (fail closed)"; exit 1
            fi
            # Each list with a non-zero count must have produced ITS stream:
            # checking only the streams that exist let a selected list that
            # wrote nothing (e.g. golden_count=1, no golden stream) pass.
            owe() { # <stream> <count>
              if ! [[ "$2" =~ ^[0-9]+$ ]]; then
                echo "::error::tests-ran RED: $1 count '$2' is not a number (fail closed)"; exit 1
              fi
              if [ "$2" -gt 0 ] && [ ! -s "events/$1-events.json" ]; then
                echo "::error::tests-ran RED: $1 list has $2 file(s) but events/$1-events.json is missing or empty (fail closed)"; exit 1
              fi
            }
            if ! [[ "$UNIT_COUNT" =~ ^[0-9]+$ ]]; then
              echo "::error::tests-ran RED: unit count '$UNIT_COUNT' is not a number (fail closed)"; exit 1
            fi
            if [ "$UNIT_COUNT" -gt 0 ]; then verify_unit; fi
            owe golden "$GOLDEN_COUNT"
            owe tz-tokyo "$TZ_COUNT"
            owe tz-honolulu "$TZ_COUNT"
            # The Kyiv rail step runs only when the rail file is in the tz
            # list. The base-owned resolver says whether it is (kyiv_count),
            # so the owed Kyiv stream never depends on PR-produced events.
            if [ -n "${KYIV_COUNT:-}" ]; then
              owe tz-kyiv "$KYIV_COUNT"
            else
              # Fallback only for a base resolver that predates kyiv_count:
              # infer from the Tokyo stream (same list), loudly.
              echo "::warning::base resolver has no kyiv_count; inferring from the Tokyo stream"
              rail=test/features/booking/presentation/bookings_day_rail_test.dart
              if [ -s events/tz-tokyo-events.json ] && jq -R -e --arg r "$rail" \
                  'fromjson? | select(.type == "suite") | .suite.path | select(. == $r or endswith("/" + $r))' \
                  events/tz-tokyo-events.json >/dev/null; then
                owe tz-kyiv 1
              fi
            fi
            for st in "${streams[@]}"; do
              echo "tests-ran: $st"
              bash "$chk" "$st" selective
            done
          else
            echo "::error::tests-ran RED: run_all='$RUN_ALL' with test_count='$TEST_COUNT' (fail closed)"; exit 1
          fi

  # End-to-end integration tests (Fix 4, 2026-06-02): the real app on a headless emulator.
  # Phase 401 D3/D4: selective PRs run the selected flows; FULL runs the two parts.
  # why: docs/ci/emulator-integration.md#job-integration
  integration:
    name: Integration tests (emulator)
    runs-on: ubuntu-latest
    needs: plan
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol')
      && (needs.plan.outputs.mode == 'full' || needs.plan.outputs.integration_count != '0')
    # Backstop for the per-invocation `timeout`s (else GitHub's 6 h default).
    # why: docs/ci/emulator-integration.md#integration-timeout
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Audit S-L4: the ONE shared Flutter + pub get + build_runner setup (same
      # commands as before, same order; the pub-cache key now also covers
      # pubspec.yaml / api/pubspec.yaml / build.yaml).
      - name: Set up Flutter, pub get, codegen
        uses: ./.github/actions/flutter-setup

      # Phase 401 (selective PRs only). The plan job's lists; the generator and
      # the part-vs-selected decision come from the BASE commit (trusted/), like
      # the selector: a PR must not be able to shrink its own integration run.
      - name: Download test selection
        if: needs.plan.outputs.mode == 'selective'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: ci-selection
          path: ${{ runner.temp }}/sel

      # S2: a PR can commit a top-level `trusted/` (any file or symlink); the
      # checkout below must not land on top of it. The plan guard also rejects
      # such a diff (is_forbidden), this is the second, local line of defence.
      - name: Remove any PR-made trusted/ path
        if: needs.plan.outputs.mode == 'selective'
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/trusted"

      - name: Checkout trusted tooling (base commit)
        if: needs.plan.outputs.mode == 'selective'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          sparse-checkout: tool/ci
          persist-credentials: false

      # S2: prove the tooling really is the base commit before anything runs it.
      - name: Verify the trusted checkout is the base commit
        if: needs.plan.outputs.mode == 'selective'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          t="$GITHUB_WORKSPACE/trusted"
          if [ -L "$t" ] || [ ! -d "$t/.git" ] || [ -L "$t/.git" ]; then
            echo "::error::trusted/ is not a plain git checkout"; exit 1
          fi
          top="$(git -C "$t" rev-parse --show-toplevel)"
          got="$(git -C "$t" rev-parse HEAD)"
          if [ "$top" != "$(cd -P "$t" && pwd -P)" ] || [ "$got" != "$EXPECTED_SHA" ]; then
            echo "::error::trusted/ is not the base commit (expected $EXPECTED_SHA, got $got)"; exit 1
          fi
          echo "trusted/ = $got"

      # P2: Gradle cache RESTORE ONLY on pull_request; save runs on push / dispatch only.
      # why: docs/ci/emulator-integration.md#gradle-cache
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-it-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-it-${{ runner.os }}-

      # entry=selected only after a clean trusted generator run; else `parts` (400 D7).
      # S1/S3 hardening; P3 bound = clamp(420 + 45 * flows, 600, 1500) s.
      # why: docs/ci/emulator-integration.md#choose-entry
      - name: Choose integration entry (selected flows or the two parts)
        id: entry
        if: needs.plan.outputs.mode == 'selective'
        shell: bash
        run: |
          set -uo pipefail
          t="$GITHUB_WORKSPACE/trusted/tool/ci"
          gen="$t/affected_tests/bin/gen_integration_entry.dart"
          entry=parts; count=0; bound=1500
          rm -rf integration_test/ci_selected_tests.dart
          if [ -f "$gen" ] && [ -f "$t/run_it_attempt.sh" ]; then
            pk="$RUNNER_TEMP/empty_package_config.json"
            echo '{"configVersion":2,"packages":[]}' >"$pk"
            out="$(dart --packages="$pk" "$gen" --selection "$RUNNER_TEMP/sel/selection.json" --repo "$GITHUB_WORKSPACE")" || out=""
            if [ "$(printf '%s\n' "$out" | grep -c '^entry=')" = 1 ] &&
               [ "$(printf '%s\n' "$out" | sed -n 's/^entry=//p')" = selected ]; then
              c="$(printf '%s\n' "$out" | sed -n 's/^count=//p')"
              if [[ "$c" =~ ^[0-9]+$ ]] && [ "$c" -ge 1 ] && [ "$c" -le 40 ]; then
                entry=selected; count="$c"
              fi
            fi
          else
            echo "::warning::base commit has no gen_integration_entry.dart / run_it_attempt.sh; running the two parts"
          fi
          f=integration_test/ci_selected_tests.dart
          if [ "$entry" != "selected" ] || [ -L "$f" ] || [ ! -f "$f" ] || [ ! -s "$f" ]; then
            entry=parts; count=0
            rm -rf "$f"
          fi
          if [ "$entry" = selected ]; then
            bound=$((420 + 45 * count))
            [ "$bound" -lt 600 ] && bound=600
            [ "$bound" -gt 1500 ] && bound=1500
          fi
          {
            echo "entry=$entry"
            echo "count=$count"
            echo "bound=$bound"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Integration entry: \`$entry\`"
            if [ "$entry" = "selected" ]; then
              echo
              echo "$count flow(s), per-attempt bound ${bound}s"
              echo
              echo '```dart'
              cat "$f"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # KVM is required for hardware-accelerated emulator boot on the runner.
      - name: Enable KVM
        uses: ./.github/actions/enable-kvm

      # 2026-07-07: upstream emulator ColorBuffer crash AFTER the tests; gate on log
      # content, retry with a fresh boot, separate boots per part.
      # why: docs/ci/emulator-integration.md#root-cause-2026-07-07
      - name: Run integration tests — part 1 (attempt 1)
        id: it-part1-attempt-1
        if: steps.entry.outputs.entry != 'selected'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # ram-size/heap-size (2026-07-01): harmless baseline bump.
          # why: docs/ci/emulator-integration.md#ram-size
          ram-size: 4096M
          heap-size: 512M
          # One aggregating file per invocation (directory mode cannot relaunch).
          # EXTERNAL `timeout` (2026-08-17): no in-isolate bound survives event-loop starvation.
          # why: docs/ci/emulator-integration.md#external-timeout
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part1.dart > part1.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part1.log; echo "PART 1: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part1.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part1.log && { echo "PART 1: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part1.log || { echo "PART 1: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 1: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Run integration tests — part 1 (attempt 2)
        id: it-part1-attempt-2
        if: steps.it-part1-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part1.dart > part1.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part1.log; echo "PART 1: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part1.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part1.log && { echo "PART 1: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part1.log || { echo "PART 1: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 1: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Run integration tests — part 1 (attempt 3)
        id: it-part1-attempt-3
        if: steps.it-part1-attempt-1.outcome == 'failure' && steps.it-part1-attempt-2.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part1.dart > part1.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part1.log; echo "PART 1: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part1.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part1.log && { echo "PART 1: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part1.log || { echo "PART 1: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 1: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Run integration tests — part 2 (attempt 1)
        id: it-part2-attempt-1
        if: steps.entry.outputs.entry != 'selected'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part2.dart > part2.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part2.log; echo "PART 2: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part2.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part2.log && { echo "PART 2: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part2.log || { echo "PART 2: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 2: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Run integration tests — part 2 (attempt 2)
        id: it-part2-attempt-2
        if: steps.it-part2-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part2.dart > part2.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part2.log; echo "PART 2: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part2.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part2.log && { echo "PART 2: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part2.log || { echo "PART 2: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 2: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Run integration tests — part 2 (attempt 3)
        id: it-part2-attempt-3
        if: steps.it-part2-attempt-1.outcome == 'failure' && steps.it-part2-attempt-2.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part2.dart > part2.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part2.log; echo "PART 2: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part2.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part2.log && { echo "PART 2: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part2.log || { echo "PART 2: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 2: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      # Selected-flow attempts: pass/fail in base-owned run_it_attempt.sh (P3/P5/P7),
      # judged from the JSON test protocol, never stdout.
      # why: docs/ci/emulator-integration.md#selected-attempts
      - name: Run integration tests — selected flows (attempt 1)
        id: it-sel-attempt-1
        if: steps.entry.outputs.entry == 'selected'
        continue-on-error: true
        env:
          SEL_BOUND: ${{ steps.entry.outputs.bound }}
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            bash "$GITHUB_WORKSPACE/trusted/tool/ci/run_it_attempt.sh" integration_test/ci_selected_tests.dart selected.log "$SEL_BOUND" "$RUNNER_TEMP/it-sel"

      - name: Run integration tests — selected flows (attempt 2)
        id: it-sel-attempt-2
        if: steps.entry.outputs.entry == 'selected' && steps.it-sel-attempt-1.outcome == 'failure'
        continue-on-error: true
        env:
          SEL_BOUND: ${{ steps.entry.outputs.bound }}
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            bash "$GITHUB_WORKSPACE/trusted/tool/ci/run_it_attempt.sh" integration_test/ci_selected_tests.dart selected.log "$SEL_BOUND" "$RUNNER_TEMP/it-sel"

      - name: Run integration tests — selected flows (attempt 3)
        id: it-sel-attempt-3
        if: steps.entry.outputs.entry == 'selected' && steps.it-sel-attempt-1.outcome == 'failure' && steps.it-sel-attempt-2.outcome == 'failure' && steps.it-sel-attempt-2.outputs.deterministic != 'true'
        continue-on-error: true
        env:
          SEL_BOUND: ${{ steps.entry.outputs.bound }}
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            bash "$GITHUB_WORKSPACE/trusted/tool/ci/run_it_attempt.sh" integration_test/ci_selected_tests.dart selected.log "$SEL_BOUND" "$RUNNER_TEMP/it-sel"

      - name: Verify integration tests passed on some attempt
        if: always()
        # S4: step outputs/outcomes reach the shell through env, never by
        # interpolating `${{ }}` into the script text.
        env:
          ENTRY: ${{ steps.entry.outputs.entry }}
          SEL1: ${{ steps.it-sel-attempt-1.outcome }}
          SEL2: ${{ steps.it-sel-attempt-2.outcome }}
          SEL3: ${{ steps.it-sel-attempt-3.outcome }}
          P1A1: ${{ steps.it-part1-attempt-1.outcome }}
          P1A2: ${{ steps.it-part1-attempt-2.outcome }}
          P1A3: ${{ steps.it-part1-attempt-3.outcome }}
          P2A1: ${{ steps.it-part2-attempt-1.outcome }}
          P2A2: ${{ steps.it-part2-attempt-2.outcome }}
          P2A3: ${{ steps.it-part2-attempt-3.outcome }}
        run: |
          if [[ "$ENTRY" == "selected" ]]; then
            if [[ "$SEL1" == "success" || "$SEL2" == "success" || "$SEL3" == "success" ]]; then
              echo "SELECTED FLOWS: passed."
              exit 0
            fi
            echo "SELECTED FLOWS: no attempt passed (a real regression, a deterministic failure that skipped the last attempt, or the known upstream emulator flake — see the attempt logs)."
            exit 1
          fi
          if [[ "$P1A1" == "success" || "$P1A2" == "success" || "$P1A3" == "success" ]]; then
            echo "PART 1: passed."
            part1_ok=1
          else
            echo "PART 1: all 3 attempts failed."
            part1_ok=0
          fi
          if [[ "$P2A1" == "success" || "$P2A2" == "success" || "$P2A3" == "success" ]]; then
            echo "PART 2: passed."
            part2_ok=1
          else
            echo "PART 2: all 3 attempts failed."
            part2_ok=0
          fi
          if [[ "$part1_ok" == "1" && "$part2_ok" == "1" ]]; then
            echo "Both parts passed."
          else
            echo "At least one part failed all 3 attempts — either a real test" \
                 "regression, or an exceptionally unlucky run of the known" \
                 "upstream emulator flake (docs/ci_investigation_notes.md)." \
                 "Check the attempt logs above: a genuine test failure shows" \
                 "'EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK'; the known flake" \
                 "shows every assertion passing followed by 'adb: device" \
                 "offline' / 'Failed to find ColorBuffer' / 'No supported" \
                 "devices connected'."
            exit 1
          fi

      # P2: SAVE only outside pull_request (push to dev/main, dispatch, nightly):
      # a PR run can never poison what other runs restore. Skipped on an exact hit.
      - name: Save Gradle cache
        if: success() && github.event_name != 'pull_request' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # N1: the key computed by the restore step, not a second hashFiles() after
          # the build (an input that changed meanwhile would save under a different
          # key than the one restored: key drift).
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  # Profile-mode drive (2026-06-18, finding 6): logout flow with asserts stripped.
  # Gated (dispatch / run-patrol). No screenshots: FLAG_SECURE makes them black.
  # why: docs/ci/emulator-integration.md#job-integration-profile
  integration-profile:
    name: Integration profile drive (emulator)
    runs-on: ubuntu-latest
    # Skip on ordinary push/PR; opt in via dispatch (manual or nightly), or label —
    # mirrors the `patrol` job's gating idiom.
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'run-patrol')))
    # Without this the job inherits GitHub's 6-HOUR default (it boots an
    # emulator like `integration`). Set between patrol (45) and integration (180):
    # it drives ONE profile-mode test file, not the six-invocation suite.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Audit S-L4: the ONE shared Flutter + pub get + build_runner setup (same
      # commands as before, same order; the pub-cache key now also covers
      # pubspec.yaml / api/pubspec.yaml / build.yaml).
      - name: Set up Flutter, pub get, codegen
        uses: ./.github/actions/flutter-setup

      # KVM is required for hardware-accelerated emulator boot on the runner.
      - name: Enable KVM
        uses: ./.github/actions/enable-kvm

      - name: Run logout flow in profile mode on emulator
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # AOT, asserts stripped. ONE PHYSICAL LINE: emulator-runner runs each line via `sh -c`.
          # why: docs/ci/emulator-integration.md#profile-one-line
          script: |
            timeout --signal=TERM --kill-after=60 900 flutter drive --profile --driver=test_driver/integration_test.dart --target=integration_test/logout_flow_test.dart; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then echo "PROFILE DRIVE: TIMED OUT after 900s (rc=$RC). External bound — an in-isolate one cannot catch event-loop starvation; see the part1/part2 note in the integration job above."; fi; exit $RC

  # Patrol native E2E (phase 17.5): OS-level surfaces via native instrumentation.
  # Runs on dispatch, `run-patrol`, or a native-surface PR (per-trigger table in the doc).
  # why: docs/ci/patrol.md#job-patrol
  patrol:
    name: Patrol native E2E (emulator) (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # 45 min bound (2026-07-22: a hung emulator sat ~90 min).
    # why: docs/ci/patrol.md#patrol-timeout
    timeout-minutes: 45
    # API 34 only: the API 29 x86_64 image crashes (jemalloc SIGSEGV) before any test.
    # why: docs/ci/patrol.md#patrol-matrix
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    # `plan` supplies the native-surface flag (it replaced the old `changes`
    # job). If plan fails, patrol is skipped and `ci-gate` goes red.
    needs: plan
    # Skip on ordinary push/PR; run on dispatch (manual or nightly), the opt-in
    # label, or a PR that touches a native surface. See the per-trigger table
    # in the comment block above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.labels.*.name, 'run-patrol') ||
        needs.plan.outputs.native == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Audit S-L4: the ONE shared Flutter + pub get + build_runner setup (same
      # commands as before, same order; the pub-cache key now also covers
      # pubspec.yaml / api/pubspec.yaml / build.yaml).
      - name: Set up Flutter, pub get, codegen
        uses: ./.github/actions/flutter-setup

      # patrol_cli is a GLOBAL tool, EXACT-pinned to the `patrol` package (2026-07-22 break).
      # Bump BOTH together: this pin and `patrol:` in pubspec.yaml.
      # why: docs/ci/patrol.md#patrol-cli-pin
      - name: Install patrol_cli
        run: |
          dart pub global activate patrol_cli 4.5.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: patrol doctor
        run: patrol doctor

      # KVM is required for hardware-accelerated emulator boot on the runner.
      - name: Enable KVM
        uses: ./.github/actions/enable-kvm

      - name: Run patrol native tests on emulator
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          # Scope to integration_test/patrol (non-patrol flows stay on `integration`).
          # why: docs/ci/patrol.md#patrol-scope
          script: |
            # Background device logcat (own line, so it survives this line's sh -c).
            # why: docs/ci/patrol.md#patrol-logcat-capture
            adb logcat -c || true; adb logcat -b all -v time > "$GITHUB_WORKSPACE/patrol-logcat.txt" 2>&1 &
            # Keep the ADB-install verifier out of the way during patrol's reinstall.
            adb shell settings put global verifier_verify_adb_installs 0 || true
            # BACKGROUND RE-APPROVAL LOOP (load-bearing): cadence MUST stay 1s; stops via
            # the sentinel file; ONE self-contained line.
            # why: docs/ci/patrol.md#approve-loop
            rm -f /tmp/patrol_approve_done || true
            ( i=0; while [ ! -f /tmp/patrol_approve_done ] && [ "$i" -lt 1200 ]; do out1=$(timeout 10 adb shell pm set-app-links --package com.beautica.beautica_mobile 2 beautica-backend-production.up.railway.app 2>&1); rc1=$?; out2=$(timeout 10 adb shell pm set-app-links-user-selection --user 0 --package com.beautica.beautica_mobile true beautica-backend-production.up.railway.app 2>&1); rc2=$?; if [ "$rc1" -ne 0 ] || [ -n "$out1" ] || [ "$rc2" -ne 0 ] || [ -n "$out2" ]; then echo "APPROVE-LOOP iter=$i set-app-links rc=$rc1 out=[$out1] user-selection rc=$rc2 out=[$out2]" >> /tmp/patrol_approve.log; fi; i=$((i+1)); sleep 1; done ) &
            patrol build android --target integration_test/patrol
            # DIAGNOSTIC: domain-verification state right before the suite.
            # why: docs/ci/patrol.md#pre-test-app-links
            echo "=== pm get-app-links (pre-test) ==="; adb shell pm get-app-links com.beautica.beautica_mobile 2>&1 || true
            # GALLERY SEED (PR #79): fail here if the MediaStore fixture row is missing.
            # why: docs/ci/patrol.md#gallery-seed
            timeout 60 ./scripts/seed_gallery_fixture.sh && timeout 30 adb shell content query --uri content://media/external/images/media --projection _data | grep -q beautica_avatar_fixture.jpg || { echo "GALLERY SEED FAILED: no MediaStore row for beautica_avatar_fixture.jpg"; exit 1; }
            # Run patrol, stop the loop, exit with patrol's code: ONE line (sh -c per line).
            # why: docs/ci/patrol.md#patrol-exit
            timeout --signal=TERM --kill-after=60 900 patrol test --target integration_test/patrol --verbose; RC=$?; : > /tmp/patrol_approve_done; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then echo "PATROL TIMED OUT after 900s (rc=$RC). A healthy suite is ~10min, so this is a hang, not slowness. Two causes seen so far, and the logcat (uploaded on always()) tells them apart: (1) the DEEP-LINK test hanging because App Link approval was lost, so the URL opened in a browser, the app was backgrounded, and pump() blocked forever waiting for a frame the stopped engine never produced — check the re-approval loop above is still at 1s; (2) patrol_cli stuck on its post-run uninstall against a wedged adb link, which looks like the suite finishing and then nothing."; fi; exit $RC

      - name: Collect emulator host-side diagnostics
        # The ColorBuffer race prints on the emulator's stdout (unreachable); collect the rest.
        # why: docs/ci/patrol.md#host-diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p emulator-diag
          for d in /tmp/android-"$USER" /tmp/android-unknown "$HOME"/.android; do
            [ -d "$d" ] && find "$d" -maxdepth 2 -type f \( -name '*.log' -o -name '*crash*' -o -name '*.ini' \) \
              -exec cp --parents {} emulator-diag/ \; 2>/dev/null || true
          done
          # GL / gfxstream lines that DID make it into the device log.
          grep -aiE 'ColorBuffer|gfxstream|emuglGLES|EGL_emulation|gralloc|swiftshader' \
            patrol-logcat.txt > emulator-diag/gl-chatter.txt 2>/dev/null || true
          # App Link approval: the loop's own failures (only written when a
          # command errors or emits output), plus the final verification state.
          cp /tmp/patrol_approve.log emulator-diag/ 2>/dev/null || true
          adb shell pm get-app-links com.beautica.beautica_mobile \
            > emulator-diag/app-links-final.txt 2>&1 || true
          grep -aiE 'VIEW|BROWSABLE|webview_shell|assetlinks|DomainVerification|set-app-links' \
            patrol-logcat.txt > emulator-diag/deeplink-chatter.txt 2>/dev/null || true
          echo "collected:"; find emulator-diag -type f | head -40

      - name: Upload patrol device logcat
        # `always()`, NOT `failure()`: diagnostics must survive cancellation and timeout.
        # why: docs/ci/patrol.md#logcat-always
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          # Per-API suffix keeps the artifact name unique across the parallel
          # matrix jobs — actions/upload-artifact requires unique names.
          name: patrol-logcat-${{ github.run_number }}-api${{ matrix.api-level }}
          path: |
            patrol-logcat.txt
            emulator-diag/
          if-no-files-found: ignore
          retention-days: 7

  # ci-gate (phase 397): the ONLY required check; never skipped (mirrors on noop).
  # Verdict in tool/ci/gate.sh. Every new job MUST be added to `needs:`.
  # why: docs/ci/README.md#job-ci-gate
  ci-gate:
    name: ci-gate
    if: always()
    needs: [plan, gates-fast, gates, selector-tests, unit, tz-sweeps, goldens, apk, coverage, test, tests-ran, integration, integration-profile, patrol]
    runs-on: ubuntu-latest
    # 205 min: a noop mirror waits for the real run (integration 180 + queue).
    # why: docs/ci/README.md#ci-gate-timeout
    timeout-minutes: 205
    permissions:
      actions: read
      contents: read
    steps:
      # The scripts come from the BASE commit on PRs: a PR must not be able to
      # edit the check that judges it.
      - name: Checkout gate scripts (base commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            tool/ci/gate.sh
            tool/ci/mirror.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Mirror the real run (irrelevant label)
        if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.event.label.name != 'run-patrol'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -x tool/ci/mirror.sh ] || { echo "::error::base commit has no tool/ci/mirror.sh; cannot mirror (fail closed)"; exit 1; }
          [ -n "$HEAD_SHA" ] && [ -n "$PR_NUMBER" ] || { echo "::error::no PR head sha / number"; exit 1; }
          # The real run may not be listed yet (label added the instant the PR
          # opened): poll up to ~3 min (6 x 30 s), then fail closed. Runs are
          # scoped to THIS PR (pull_requests[].number), not just the head sha.
          id=""
          for attempt in 1 2 3 4 5 6; do
            id="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
              | ./tool/ci/mirror.sh select "$PR_NUMBER")" || id=""
            [ -z "$id" ] || break
            echo "no real pr-validate run for PR #$PR_NUMBER @ $HEAD_SHA yet (attempt $attempt/6)"
            [ "$attempt" -eq 6 ] || sleep 30
          done
          [ -n "$id" ] || { echo "::error::no real pr-validate run found for PR #$PR_NUMBER @ $HEAD_SHA to mirror after ~3 min (fail closed)"; exit 1; }
          echo "Mirroring run $id"
          # 12000 s = 200 min > the slowest real job (integration, 180 min) plus
          # queue time (job timeouts start counting only once a runner is assigned).
          # Exit status of watch is advisory; the verdict is re-read below.
          timeout --signal=KILL 12000 gh run watch "$id" --interval 60 --exit-status >/dev/null || echo "::warning::watch of run $id ended non-zero or timed out"
          read -r status conclusion < <(gh run view "$id" --json status,conclusion --jq '"\(.status) \(.conclusion)"')
          ./tool/ci/mirror.sh verdict "${status:-}" "${conclusion:-}"

      - name: Evaluate needs (fail closed)
        if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'full-ci' || github.event.label.name == 'run-patrol'
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
          PLAN_SELECTION_COUNT: ${{ needs.plan.outputs.selection_count }}
          EXPECT_TESTS: ${{ (needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'selective') && 'true' || 'false' }}
        run: |
          if [ -x tool/ci/gate.sh ]; then
            ./tool/ci/gate.sh
          else
            # Bootstrap only (PR introducing the gate): minimal inline verdict.
            echo "::warning::base commit has no tool/ci/gate.sh; inline verdict"
            case "$PLAN_MODE" in full | selective) ;; *) echo "bad plan mode '$PLAN_MODE'"; exit 1 ;; esac
            printf '%s' "$NEEDS_JSON" | jq -e '
              to_entries | map(select((.key == "plan" and .value.result != "success")
                or .value.result == "failure" or .value.result == "cancelled")) | length == 0' >/dev/null
          fi
