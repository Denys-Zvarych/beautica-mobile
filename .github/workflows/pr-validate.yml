name: PR Validation

on:
  pull_request:
    branches: [main, dev]
    # `labeled` lets the opt-in `run-patrol` label trigger the heavy patrol job
    # on a PR before this workflow (with workflow_dispatch) reaches the default branch.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, dev]
  # Phase 17.5 — nightly trigger for the heavy patrol native-E2E job (see the
  # `patrol` job below). The fast `validate` + `integration` jobs run on every
  # push/PR as before; the patrol job is gated to schedule / manual dispatch /
  # an opt-in PR label so its slow native compile + emulator run never blocks
  # the per-PR critical path.
  schedule:
    # 03:30 UTC nightly (off-peak; after typical EU working hours).
    - cron: '30 3 * * *'
  workflow_dispatch: {}

jobs:
  validate:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      # Phase 1.4+ — *.g.dart files are gitignored; codegen must run on every
      # fresh checkout before analyze/test can succeed.
      - name: Codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Phase 3.1 — OpenAPI client drift gate.
      # Regenerates the Dart client from the COMMITTED spec snapshot
      # (tool/openapi/api-spec.json) into a temp dir, then diffs against the
      # committed api/.  Fails if they diverge — no live backend needed.
      # Tool setup: openapi_generator_cli is activated on the first run and
      # its JAR is cached in .dart_tool/openapi_generator_cache/.
      - name: Install openapi-generator-cli
        # Pinned to 6.1.0 (wraps JAR 7.9.0) — must match scripts/regenerate_api.sh.
        # Update both locations together to avoid spec-drift between local and CI.
        run: dart pub global activate openapi_generator_cli 6.1.0

      - name: Verify built_value codegen is internally consistent
        # Named, dependency-free guard for a live incident (2026-07-02): a
        # build_runner incremental-cache staleness bug let two generated
        # .g.dart files silently fall behind their .dart sources (a missing
        # Builder setter broke the compile; a missing @SerializersFor
        # registration would have caused a silent runtime "Serializer not
        # found" failure). Runs before the slower JAR-based check below so a
        # codegen-consistency break fails fast. See scripts/verify_builtvalue_codegen.sh
        # --self-test and the struck-through row in docs/mobile-phases/mobile-backlog.md.
        run: ./scripts/verify_builtvalue_codegen.sh

      - name: Verify OpenAPI client is up to date
        # Contract-drift gate (Fix 3, 2026-06-02): regenerates the Dart client
        # from the committed spec and fails on any diff vs api/. The companion
        # static guard test/core/config/app_config_path_test.dart (run by the
        # Test step below) pins the other half of the contract — that
        # AppConfig.baseUrl never carries an /api/v1 prefix and the generated
        # client paths resolve to a SINGLE /api/v1/ segment (no double-prefix).
        # Run locally with:  ./scripts/regenerate_api.sh --check
        run: ./scripts/regenerate_api.sh --check

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # 2026-08-18 — this step is UNDER REVIEW and is NOT a gate today.
      #
      # It was introduced as the `no_raw_ui_strings` error gate. It never
      # gated anything: `custom_lint` discovers plugins among the analyzed
      # package's DEPENDENCIES, and a package is never a plugin of itself, so
      # `lib/beautica_mobile.dart`'s `createPlugin()` was never called. That
      # rule now lives in `scripts/forbid_raw_ui_strings.sh` (below) and the
      # plugin host has been deleted.
      #
      # `riverpod_lint` was then falsified the same way, in case IT was still
      # live and worth keeping the step for. It is not. A probe violating
      # three of its rules at once — a public property on a `Notifier`
      # (`avoid_public_notifier_properties`), `runApp` without a
      # `ProviderScope` (`missing_provider_scope`), and `ref.read` inside
      # `State.dispose` (`avoid_ref_inside_state_dispose`) — produced
      # `{"version":1,"diagnostics":[]}` and exit 0, while `flutter analyze`
      # on the same file reported normally, proving the file was in scope.
      # `custom_lint` is inert here end to end; `.dart_tool/custom_lint/` is
      # never even created, and a captured `custom_lint.log` shows the plugin
      # host failing to spawn ("The plugin screen_protector was not found in
      # the package config").
      #
      # Kept only so the deletion is a deliberate call rather than a drive-by:
      # removing it means dropping custom_lint / custom_lint_builder /
      # riverpod_lint from pubspec and `plugins: - custom_lint` from
      # analysis_options.yaml too. Until then it is a ~1s no-op that must not
      # be cited as coverage for anything.
      - name: Custom lint (INERT — under review, gates nothing)
        run: dart run custom_lint

      # 2026-08-18 — the REAL `no_raw_ui_strings` gate. AST-based (the
      # Phase 1.3 checker, unchanged and covered by 19 unit tests), driven by
      # `tool/lints/no_raw_ui_strings.dart` behind the house-pattern shell
      # guard. Escape comment: `// raw-ui-string-ok: <reason>`
      # (`// ignore: no_raw_ui_strings` also honoured). Legacy offenders are
      # grandfathered in `scripts/.raw_ui_strings_allow` — shrink-only ratchet.
      - name: Forbid raw user-visible string literals under lib/
        shell: bash
        run: ./scripts/forbid_raw_ui_strings.sh

      # Phase 1.2 spacing scale gate — every padding literal must reference
      # `AppSpacing.*` from `lib/core/theme/app_spacing.dart`. The check
      # itself lives in `scripts/forbid_magic_padding.sh` so regex churn
      # stays out of CI YAML. The script exits 0 when no offenders are
      # found, 1 the moment a raw numeric `EdgeInsets(...)` shows up
      # under `lib/`. Documented in `analysis_options.yaml`.
      - name: Forbid magic padding numbers
        shell: bash
        run: ./scripts/forbid_magic_padding.sh

      # 2026-06-18 cycle-safeguard — forbid un-annotated cross-provider
      # self-invalidation inside notifiers. A `ref.invalidate(otherProvider)` /
      # `ref.refresh(otherProvider)` from inside a Notifier can close a watch
      # cycle (CircularDependencyError, debug-only / stripped in release). The
      # check lives in scripts/forbid_provider_self_invalidation.sh (regex +
      # rationale documented there, not in this YAML). Each legitimate call is
      # unblocked by a `// cycle-safe: <reason>` annotation, never by weakening
      # the gate. Exits 0 when clean, 1 on the first un-annotated offender.
      - name: Forbid un-annotated provider self-invalidation
        shell: bash
        run: ./scripts/forbid_provider_self_invalidation.sh

      # 2026-06-18 cycle-safeguard — forbid stubbing the cycle-closing providers
      # in notifier/integration tests. The 2026-06-18 logout regression shipped
      # because those tests stubbed masterProfile/servicesList/serviceRepository,
      # breaking the real watch edge so the debug cycle assert had nothing to
      # fire on. The check lives in scripts/forbid_cycle_stub_in_tests.sh; each
      # legitimate stub is unblocked by a `// cycle-stub-ok: <reason>` annotation.
      - name: Forbid cycle-closing-provider stubs in notifier/integration tests
        shell: bash
        run: ./scripts/forbid_cycle_stub_in_tests.sh

      # 2026-06-18 — self-test the two cycle-guard gates above. Their awk
      # comment/multiline detection is load-bearing; this pins it against
      # fixture snippets (plain offender → flagged, annotated → pass, plus each
      # former known false-negative from findings 1/2/4 → now flagged). Pure
      # bash + awk, no extra dependency. See scripts/test/test_cycle_gates.sh.
      - name: Self-test cycle-guard gates
        shell: bash
        run: ./scripts/test/test_cycle_gates.sh

      # 2026-06-24 drift-prevention gate — CLIENT branch-root screens must reuse
      # the shared ClientTopBar; a per-screen Scaffold(appBar:)/AppBar() re-lays
      # out the wordmark and makes it jump on tab hop. The check lives in
      # scripts/forbid_client_branch_appbar.sh (enumerated branch roots +
      # rationale documented there). Each legitimate bar is unblocked by a
      # `// client-chrome-ok: <reason>` annotation. Exits 0 clean, 1 on offense.
      - name: Forbid AppBar in CLIENT branch-root screens
        shell: bash
        run: ./scripts/forbid_client_branch_appbar.sh

      # 2026-06-24 drift-prevention gate — forbid Cyrillic find.text('…') finders
      # in tests; they become findsNothing failures the day EN ships. Locate by
      # Key / semantics / AppLocalizations instead. Legacy files predating the
      # gate are grandfathered in scripts/.cyrillic_finder_allow (ratchet — the
      # baseline only shrinks); new exceptions use `// i18n-finder-ok: <reason>`.
      - name: Forbid Cyrillic find.text finders in tests
        shell: bash
        run: ./scripts/forbid_cyrillic_finder.sh

      # 2026-06-24 drift-prevention gate — forbid fixed pump/pumpAndSettle(const
      # Duration(...)) sleeps in tests; they are flaky (too short → red on slow
      # CI, too long → slow suite). Prefer pump-until-condition. Legacy files are
      # grandfathered in scripts/.fixed_wait_allow (ratchet — baseline only
      # shrinks); new exceptions use `// fixed-wait-ok: <reason>`.
      - name: Forbid fixed-duration pump waits in tests
        shell: bash
        run: ./scripts/forbid_fixed_wait.sh

      # 2026-06-24 fixture-footgun gate — a test that mounts ServiceForm( must
      # also override approvedCategoriesProvider. That provider sources from the
      # REAL Dio (not serviceRepositoryProvider); an un-overridden mount leaks a
      # 15s connect-timeout Timer AND paints the category field's error ring at
      # rest (silently-wrong golden). Bit 3 fixtures already. Exceptions use
      # `// approved-categories-ok: <reason>`.
      - name: Forbid unmocked approvedCategoriesProvider in ServiceForm tests
        shell: bash
        run: ./scripts/forbid_unmocked_approved_categories.sh

      # 2026-07-10 refactor-ratchet — the VelvetText font-size consolidation
      # moved 212 inline fontSize: sites under lib/features/** onto 116 cached
      # tokens (lib/core/theme/velvet_text.dart). This gate forbids a new inline
      # TextStyle(fontSize:) / .copyWith(fontSize:) from silently re-fragmenting
      # the scale. The only permitted inline sites (runtime-computed values +
      # HubAvatar/HubPhoto ctor params) are listed in scripts/.inline_fontsize_allow.
      - name: Forbid inline fontSize under lib/features (VelvetText tokens only)
        shell: bash
        run: ./scripts/forbid_inline_fontsize.sh

      # 2026-07-19 push-location safeguard — forbid a direct
      # currentConfiguration.uri/.fullPath read in tests; go_router excludes
      # ImperativeRouteMatch (the match kind context.push produces) from both,
      # so a direct read after a push keeps reporting the pre-push location
      # forever. Shipped twice for real (nav-bar-hide `ab34c0a`; the
      # "btn-menu-master not navigating" backlog MEDIUM, which was never a
      # real nav regression). Route through AppHarness.location/
      # expectLocation (integration_test/support/app_harness.dart) instead.
      # Legacy files are grandfathered in
      # scripts/.naive_router_location_allow (ratchet — baseline only
      # shrinks); new exceptions use `// router-location-ok: <reason>`.
      - name: Forbid naive currentConfiguration.uri/.fullPath reads in tests
        shell: bash
        run: ./scripts/forbid_naive_router_location.sh

      # Phase 7.1 perf P4, retargeted Phase 7.9 — BookingsDayQuery.masterOwn()
      # containment (the retired `MasterBookingsQuery.raw` this gate originally
      # guarded is gone). `.of()` is the only normalising path: it sorts
      # statuses/serviceIds canonically and truncates `day` to date-only, so a
      # rail wired straight to `.masterOwn(` mints a new bookingsDayProvider
      # family member per tap. Has to be a structural gate: nothing about the
      # leak is visible to a test or a lint (the screen behaves correctly, it
      # just refetches per tap).
      - name: Forbid BookingsDayQuery.masterOwn outside its declaring file
        shell: bash
        run: ./scripts/forbid_raw_bookings_query.sh

      # 2026-07-20 incident — an absolute DateTime.utc(2026, 7, 20, 15) anchor
      # hand-rolled into four booking-detail specs quietly expired against the
      # real wall clock (BookingDisplayX.isPast), turning 16 "upcoming booking"
      # assertions into false negatives on a date, not a code change. Legacy
      # files predating this gate are grandfathered in
      # scripts/.stale_future_date_allow (ratchet — baseline only shrinks);
      # new exceptions use `// future-date-ok: <reason>`.
      #
      # 2026-07-21 — scan widened to `integration_test/` as well. The gate was
      # green through the recurrence because it only ever walked
      # `test/features/booking/`, while a SECOND copy of the same expired
      # instant sat in `integration_test/support/fake_backend.dart`
      # (`bookingStartsAt`) and silently flipped every E2E CONFIRMED-affordance
      # assertion. A guard that cannot see a tier does not protect it.
      - name: Forbid stale absolute future-date fixtures in booking + E2E tests
        shell: bash
        run: ./scripts/forbid_stale_future_date_fixture.sh

      # 2026-08-02 (Phase 225 audit cycles 4 and 5, and again same day) — the
      # dev VM this project is built on runs TZ=Europe/Kyiv, which is ALSO the
      # business timezone (kBeauticaTimeZoneName). A bare local
      # DateTime(2026, 6, 14, 12) resolves its underlying instant through the
      # HOST PROCESS's own TZ, so on the dev VM it is indistinguishable from a
      # correctly-pinned Kyiv instant and silently stops discriminating
      # anything, while CI (TZ=UTC) or any other machine resolves it to a
      # DIFFERENT instant — the fixture then either never fails locally no
      # matter what the zone-conversion code does, or fails only on CI and
      # reads as unrelated flake. This has shipped three times, most recently
      # in `lib/core/time/clock_provider.dart`'s own doc comment, which taught
      # the bad pattern as the canonical override example (fixed alongside
      # this gate). Every zone-critical test file (one that touches
      # toBeauticaTime/clockProvider/TZDateTime/beauticaZone/
      # kBeauticaTimeZoneName) must instead pin `DateTime.utc(...)` or a
      # `TZDateTime(...)` anchored to a named device zone. No allow-list — see
      # the script header. Escape hatch: `// host-tz-ok: <reason>`.
      - name: Forbid host-local instant anchors in zone-critical tests
        shell: bash
        run: ./scripts/forbid_host_local_instant_anchor.sh

      # 2026-08-02 — companion PRODUCTION-code gate to the test-only one
      # above. The locked principle (ARCHITECTURE-mobile.md § 0.9): the
      # device clock supplies the current INSTANT, Europe/Kyiv decides which
      # calendar DAY it falls on. A classifying gate that only flags the
      # BUGGY `DateTime.now()` reads is impossible by grep alone —
      # `endAt.isBefore(DateTime.now())` (a correct absolute-instant
      # comparison) and `dateOnly(DateTime.now())` (the bug) are
      # syntactically identical at the call site; they differ only in what
      # the RESULT flows into. So this is a DECLARATION gate instead: it
      # flags every live-code `DateTime.now` reference under `lib/` — call
      # form and bare tear-off alike — unless it is annotated
      # `// instant-ok: <reason>` or is the ONE hard-coded exemption
      # (`clock_provider.dart`'s own seam definition). See the script header
      # for the full rationale and for why a `dateOnly(` gate was rejected
      # (real false positives: `days.map(dateOnly)`,
      # `bookings_day_query.dart`).
      - name: Forbid un-annotated raw clock reads in production code
        shell: bash
        run: ./scripts/forbid_raw_clock_read.sh

      # 2026-07-22 — `tester.enterText` is a SILENT NO-OP in profile/release
      # unless the harness registers the test text-input mock: the editing
      # state is posted with client id -1 (both
      # IntegrationTestWidgetsFlutterBinding and PatrolBinding override
      # `registerTestTextInput => false`), and the -1 escape hatch in
      # TextInput._handleTextInputInvocation lives inside an
      # `assert(() {...}())` block that non-debug builds strip. Every field
      # then stays empty and the flow fails downstream with a misleading tap
      # error. 16 integration flows call enterText and ALL boot through
      # AppHarness.boot, so one deleted line silently guts the
      # `integration-profile` job. Invisible to analyze, to lints, and to the
      # debug suite (debug keeps the assert) — hence a structural gate.
      - name: Forbid missing testTextInput.register() in integration harnesses
        shell: bash
        run: ./scripts/forbid_missing_test_text_input.sh

      # 2026-07-22 vacuous-assertion audit — `RouteNames.home` is '/', and
      # AppHarness.expectLocation matched with `startsWith`, so
      # `expectLocation(router, RouteNames.home)` reduced to `startsWith('/')`:
      # satisfied by every one of the ~59 routes in the app. TWO login flows
      # shipped it as their closing assertion (auth_login_patrol_test.dart,
      # auth_login_flow_test.dart) — one of them with a comment recording the
      # vacuity and the assertion left in place. The helper now matches
      # segment-aware AND rejects '/' at runtime; this gate is the static half,
      # and also catches a freshly hand-rolled local copy of the helper that
      # would not inherit the runtime guard.
      #
      # Distinct from forbid_naive_router_location.sh, the near-miss above:
      # that gate governs WHERE the location is read from and says nothing
      # about WHAT it is compared against. Zero baseline — no allow-list.
      - name: Forbid vacuous expectLocation(..., RouteNames.home) assertions
        shell: bash
        run: ./scripts/forbid_expectlocation_home.sh

      # 2026-07-22 — forbid '/' inside a patrolTest description.
      # AndroidTestOrchestrator names a per-test output file after the
      # description and Context.openFileOutput rejects path separators, so one
      # slash kills the orchestrator PROCESS. It surfaces only as
      # "Instrumentation run failed due to Process crashed" with zero failed
      # assertions — indistinguishable at a glance from the unrelated emulator
      # device-loss issue, and completely invisible to analyze/format/test,
      # since nothing host-side touches the orchestrator. Static gate is the
      # only place this can be caught cheaply. Zero baseline, no allow-list.
      - name: Forbid slashes in patrol test names
        shell: bash
        run: ./scripts/forbid_slash_in_patrol_test_name.sh

      # 2026-07-31 — forbid a bare pumpAndSettle() straight after a
      # results-screen tap. SearchResultsScreen keeps an INDETERMINATE
      # _LoadMoreSpinner mounted while data.hasMore (FakeBackend seeds
      # totalPages: 2), so quiescence never arrives and the settle times out
      # MID-PUMP — tripping !_expectingFrame in postTest, which kills every
      # LATER test in the file with '!inTest' before they execute a line. That
      # is how 7 tests in client_search_flow_test.dart had never once been
      # observed running. The hazard was documented in comments six times in
      # that one file and still recurred on the seventh flow; prose does not
      # gate. Deliberately NARROW (local tap→settle adjacency only) — the true
      # condition is runtime `hasMore`, which no grep can see; see the script
      # header's KNOWN BLIND SPOTS. Zero baseline, no allow-list.
      - name: Forbid bare pumpAndSettle after a results-screen tap
        shell: bash
        run: ./scripts/forbid_results_bare_pump_and_settle.sh

      # 2026-07-31 — forbid a direct cast on a queryParameters read inside
      # integration_test/support. The generated OpenAPI client sends repeatable
      # params as a Dio ListParam, and WHICH params are repeatable is decided by
      # the backend spec — so a param that is scalar today flips under any
      # ./scripts/regenerate_api.sh with no mobile code change. The cast then
      # throws INSIDE the DioAdapter route callback, which never reads as "the
      # fake is broken": the request fails, the provider goes AsyncError, and
      # the screen paints an error body, so the failure surfaces as unrelated
      # downstream assertions in other files. This exact bug has shipped THREE
      # times in one file (status, then serviceId on working-days, then
      # serviceId on slots — the last reddened 4 tests across 2 flows). Reads
      # must route through _multiQueryParam / _scalarQueryParam, which tolerate
      # ListParam / List / scalar / absent alike. Zero baseline, same-line
      # `// query-param-cast-ok:` escape hatch.
      - name: Forbid raw casts on queryParameters reads in test fakes
        shell: bash
        run: ./scripts/forbid_raw_query_param_cast.sh

      # 2026-07-31 — forbid a blind tester.tap on a booking-calendar-day-* cell.
      # MonthCalendar sits in a SingleChildScrollView; on the 800x600 test
      # surface the scroll fold is at y~419 while the last two grid rows centre
      # at y~440/490. A blind tap on a below-the-fold cell does NOT throw — the
      # finder resolves, tap() computes a centre, and the tap lands on the
      # summary bar and is silently swallowed, failing later on an unrelated
      # assertion. Crucially it is DATE-DEPENDENT (tests tap DateTime.now().day),
      # so the suite is green ~18 days a month and red the last ~12 — it reads
      # as flake and gets re-run rather than fixed. Enabled-cell taps must go
      # through tester.tapCalendarDay (ensureVisible first). Tests proving a
      # cell is INERT keep tapping directly and declare it with
      # `warnIfMissed: false` — that is the exemption token. Zero baseline.
      - name: Forbid blind taps on calendar day cells
        shell: bash
        run: ./scripts/forbid_blind_calendar_tap.sh

      # 2026-07-31 — every CLIENT shell branch screen must carry the stable
      # `client-branch-<slug>` Key its placeholder exposed. Shell E2Es target
      # those keys to assert which branch is showing (text would couple them to
      # UA copy). The Phase 13.7 placeholder->HomeHubScreen migration dropped
      # `client-branch-home` while every sibling carried theirs over, leaving
      # two shell flows quietly red for a reason that looked like a navigation
      # bug. The widget tier is structurally blind to this: its branch-key
      # assertions pump the PLACEHOLDER, not the replacement. The branch->screen
      # mapping is derived from app_router.dart, so placeholder-served branches
      # are skipped automatically and a graduating branch is covered the day it
      # graduates - no allow-list to maintain.
      - name: Forbid a client shell branch screen missing its branch Key
        shell: bash
        run: ./scripts/forbid_missing_client_branch_key.sh

      # 2026-08-14 — the calendar-consolidation change (mobile-backlog D5)
      # collapsed every month/week calendar surface onto ONE shared file
      # (`lib/shared/widgets/calendar_grid.dart`) precisely so a future D1–D4-
      # style fix lands everywhere at once — before it, `period_range_picker
      # .dart` had silently forked ~250 lines of `month_calendar.dart`'s
      # weekday-bar/week-row/day-cell logic, which is why those fixes had to
      # be re-applied there by hand once discovered. This gate makes the
      # single-implementation property mechanical: no second definition of
      # the shared primitives, no hardcoded copy of the weekendMuted hex, and
      # no raw Color hex literal in any of the three known calendar-grid
      # consumers. Zero baseline.
      - name: Forbid a forked calendar-grid implementation
        shell: bash
        run: ./scripts/forbid_forked_calendar_grid.sh

      # 2026-06-24 — self-test the drift gates above. Each gate's
      # comment/annotation detection is load-bearing; --self-test pins it against
      # fixture snippets (plain offender → flagged, annotated/commented → pass).
      - name: Self-test drift-prevention gates
        shell: bash
        run: |
          ./scripts/forbid_client_branch_appbar.sh --self-test
          ./scripts/forbid_cyrillic_finder.sh --self-test
          ./scripts/forbid_fixed_wait.sh --self-test
          ./scripts/forbid_unmocked_approved_categories.sh --self-test
          ./scripts/forbid_inline_fontsize.sh --self-test
          ./scripts/forbid_raw_bookings_query.sh --self-test
          ./scripts/forbid_naive_router_location.sh --self-test
          ./scripts/forbid_stale_future_date_fixture.sh --self-test
          ./scripts/forbid_missing_test_text_input.sh --self-test
          ./scripts/forbid_expectlocation_home.sh --self-test
          ./scripts/forbid_slash_in_patrol_test_name.sh --self-test
          ./scripts/forbid_raw_ui_strings.sh --self-test
          ./scripts/forbid_results_bare_pump_and_settle.sh --self-test
          ./scripts/forbid_raw_query_param_cast.sh --self-test
          ./scripts/forbid_blind_calendar_tap.sh --self-test
          ./scripts/forbid_missing_client_branch_key.sh --self-test
          ./scripts/forbid_forked_calendar_grid.sh --self-test
          ./scripts/forbid_magic_padding.sh --self-test
          ./scripts/forbid_cycle_stub_in_tests.sh --self-test
          ./scripts/forbid_provider_self_invalidation.sh --self-test
          ./scripts/forbid_host_local_instant_anchor.sh --self-test
          ./scripts/forbid_raw_clock_read.sh --self-test

      # Phase 1.4 — enforce go_router-only navigation in feature code.
      # Direct Navigator calls bypass the route table and are a mobile-qa HIGH
      # finding. lib/features/ is currently empty so this always passes, but the
      # gate is wired now so future feature code is gated from the first commit.
      - name: Forbid direct Navigator usage in features
        run: |
          ! grep -rE 'Navigator\.(push|pop|of)\b' lib/features/ 2>/dev/null || \
          { echo 'Direct Navigator usage found in lib/features/ — use context.go(RouteNames.x) instead'; exit 1; }

      # MS1 — SharedPreferences must never be used for tokens or PII in feature
      # code. flutter_secure_storage is the only approved secure store.
      # lib/features/ is currently empty so this always passes; the gate becomes
      # live as soon as Phase 2.2 creates the auth feature directory.
      # `2>/dev/null` suppresses "no such file" noise when the dir doesn't exist.
      - name: Forbid SharedPreferences in features (MS1)
        run: |
          MATCHES=$(grep -rE "SharedPreferences|shared_preferences" lib/features/ 2>/dev/null | grep -v "^\s*//") || true
          if [ -n "$MATCHES" ]; then
            echo "SharedPreferences found in lib/features/ — use SecureStorage instead"
            echo "$MATCHES"
            exit 1
          fi

      - name: Test
        run: flutter test --coverage --reporter=expanded --exclude-tags golden

      # The day rail's two RENDERED DST guards can only observe the bug they
      # exist to catch on a host whose UTC offset actually changes across the
      # transition. This runner is UTC, so they SKIP in the step above; this
      # step re-runs that one file under the market zone so they genuinely
      # execute on CI.
      #
      # Deliberately scoped to a single file rather than set as a job-level
      # `env: TZ`. The booking formatters are pinned to Europe/Kyiv in code and
      # `slot_time_tz_regression_test.dart` proves it by asserting Kyiv
      # wall-clocks on a NON-Kyiv runner — under `TZ=Europe/Kyiv` a regression
      # to `.toLocal()` passes that suite silently (verified by mutation). The
      # main suite must therefore stay UTC.
      #
      # Pinned by test/ci/dst_rail_ci_coverage_test.dart — renaming or dropping
      # this step fails that test.
      - name: DST rail guards (market zone)
        env:
          TZ: Europe/Kyiv
        run: flutter test test/features/booking/presentation/bookings_day_rail_test.dart --reporter=expanded

      # 2026-08-02 — a third CI zone, distinct from BOTH the main suite (UTC)
      # and the DST-rail step above (Europe/Kyiv). The main suite's UTC run
      # lets slot_time_tz_regression_test.dart PROVE Kyiv-pinning by asserting
      # Kyiv wall-clocks on a non-Kyiv host — under Kyiv itself a regression to
      # `.toLocal()` passes that suite silently (mutation-verified). But UTC
      # and Europe/Kyiv are BOTH zones this codebase's own market anchor cares
      # about, so a bug that reads the raw device/host clock instead of
      # converting through toBeauticaTime can still coincidentally agree with
      # the correct Kyiv-derived value on either of them. A zone with NO
      # relationship to Kyiv at all closes that gap: any host-clock leak fails
      # loudly here regardless of which of the other two zones it happened to
      # slip past.
      #
      # Asia/Tokyo specifically: UTC+9, and — unlike Europe/Kyiv — it observes
      # NO DST, so its offset is constant year-round. That makes the verdict a
      # property of the CODE under test, never of the CALENDAR DATE the runner
      # happens to execute on. A larger-skew zone that also carried DST would
      # make day-boundary divergence fire depending on the HOUR CI happens to
      # run — flaky-by-clock, exactly the failure mode this whole track exists
      # to eliminate.
      #
      # DIRECTION (2026-08-04, measured — see the Pacific/Honolulu step that
      # follows this one). Asia/Tokyo is EAST of Kyiv, so it only ever pushes a
      # host-local fixture BACKWARD across the Kyiv day boundary, and only for
      # a bounded band of fixture hours. For a bare `DateTime(Y,M,D,H)` on a
      # host at UTC+O, the Kyiv hour is `H - O + 3`; the Kyiv calendar day
      # differs from D only when that falls outside [0,24). At O=+9 that means
      # H < 6 — Tokyo can ONLY catch a host-local anchor whose named hour is
      # 00:00-05:59. It is structurally blind to every afternoon/evening
      # fixture, which is most of them in a booking app. That blindness is why
      # the Honolulu step below was ADDED rather than swapped in: the two zones
      # catch DISJOINT hour bands and neither subsumes the other. Both
      # directions were proven by executed mutation, not derived — see the
      # Honolulu step's own comment for the two probes and their verdicts.
      #
      # Scoped to the same date/time-sensitive directories as the rest of this
      # workflow's zone-specific coverage, not the whole suite — running
      # obviously zone-independent tests (widget layout, form validation, …)
      # under a third zone would add CI time without adding any signal.
      #
      # MEASURED, not estimated (2026-08-02) — a prior version of this comment
      # asserted "measured GREEN … (2,343 tests)" for a scope that included
      # test/shared/widgets/, but that number was never actually run: an
      # independent static grep of this exact directory list counted ~2,093
      # top-level test( / testWidgets( calls, and a separate cited run logged
      # 1,824 tests. Three numbers, none agreeing, because none of them came
      # from executing the committed scope. This directory list was then
      # ACTUALLY RUN, twice, against the exact `flutter test` invocation below:
      #   - with test/shared/widgets/ included: 2,404 passed, 5 skipped,
      #     0 failed, real 3m56.138s (TZ=Asia/Tokyo).
      #   - with test/shared/widgets/ dropped (the scope actually committed
      #     below): 2,311 passed, 5 skipped, 0 failed, real 3m44.128s
      #     (TZ=Asia/Tokyo). The 5 skips are the DST-rail guards in
      #     bookings_day_rail_test.dart, which only fire on a host whose UTC
      #     offset changes across the transition — Asia/Tokyo observes no DST,
      #     same reason they skip on the main UTC step.
      # Both runs were 0 failures, so no latent host-clock leak was found by
      # running this — this scope is a GATE against a future regression, not
      # a speculative ratchet against a hypothetical one. ~3m44s is well
      # inside the ~5 minute budget this step was designed around.
      #
      # SCOPE DECISION (2026-08-02, on the measurement above): test/shared/
      # widgets/ is DROPPED, every other directory KEPT. 0 of its 12 files
      # match scripts/forbid_host_local_instant_anchor.sh's own zone-critical
      # classifier (toBeauticaTime|clockProvider|TZDateTime|beauticaZone|
      # kBeauticaTimeZoneName), and 9 of 12 contain no time-related symbol at
      # all. The remaining 3 (period_range_picker_*_test.dart,
      # velvet_bottom_nav_bar_mount_parity_test.dart) touch DateTime only for
      # a "today" ring / a booked-day set fixture, and period_range_picker_
      # span_cap_test.dart's own header already documents its cases as
      # identical under TZ=UTC and TZ=Europe/Kyiv (calendar-only DateTime(y,
      # m, d) literals, not host-clock reads) — not the host-local-instant-
      # anchor bug class this sweep exists to catch.
      #
      # The OTHER directories in this list do NOT all score higher on that
      # same classifier — measured per directory (zone-critical files /
      # total files), 2026-08-02:
      #   test/features/booking/    8/91   test/shared/formatters/   1/8
      #   test/features/schedule/   0/19   test/shared/time/         1/1
      #   test/features/home/       1/18   test/shared/calendar/     1/1
      #   test/routing/             0/17   test/core/time/           1/1
      # test/features/schedule/ (0/19) and test/routing/ (0/17) score
      # IDENTICALLY to the dropped test/shared/widgets/ on the classifier
      # metric alone. They stay in scope anyway, on DOMAIN RELEVANCE rather
      # than classifier score: the classifier only sees what a TEST FIXTURE
      # references, not what the production widget/screen under test calls
      # internally. test/features/schedule/ renders calendar/weekly-template
      # UI, and test/routing/ contains auth_redirect_test.dart /
      # booking_route_guard_test.dart — both plausible homes for a screen or
      # guard calling DateTime.now() directly without the test file ever
      # naming toBeauticaTime. test/shared/widgets/ was dropped instead
      # because it is generic UI atoms (rating stars, error states,
      # swipe-back gestures) and was MANUALLY confirmed non-time-domain file
      # by file — the per-file check two paragraphs up, a stronger signal
      # than the classifier score alone. Do not re-derive a "0/N ⇒ safe to
      # drop" rule from the table above; test/features/schedule/ and
      # test/routing/ are the standing counterexample.
      #
      # REJECTED ALTERNATIVE: trimming to a curated file list (e.g. just the
      # ~106 files that touch a time-related symbol, or the 13 that are
      # zone-critical). Rejected because a hardcoded file list silently stops
      # covering a file added LATER — exactly the "guard that stops guarding"
      # failure class scripts/forbid_host_local_instant_anchor.sh's own header
      # was written to eliminate, and it would need manual upkeep forever.
      # Directory-level scope auto-covers new files the day they're added, at
      # a measured cost (~3m44s) this step's budget already accepts. Do not
      # re-litigate this without a fresh measurement of the CURRENT committed
      # list — see the numbers above and re-run:
      #   time TZ=Asia/Tokyo flutter test <the directories below> --reporter=expanded
      #
      # Step-level `env:` — see the DST rail guards step above for why this
      # must never become a job-level override; test/ci/dst_rail_ci_coverage_test.dart
      # asserts there is no job-level `env:` anywhere in this file.
      # 2026-08-02 — test/features/calendar/ ADDED to the sweep. It was not
      # previously in this list even though `working_hours_repository.dart`
      # (`_todayKyiv()`) became genuinely zone-critical in the same change
      # that added `scripts/forbid_raw_clock_read.sh` — the working-hours
      # repository's window-selection logic now derives "today" through the
      # Kyiv-anchored clock seam, exactly the class of code this sweep exists
      # to catch a host-clock-leak regression in. See
      # `test/features/calendar/data/working_hours_repository_test.dart`'s
      # own "Kyiv-anchored" test group for the Tokyo-pinned regression case.
      - name: Third-timezone sweep (host-clock leak detector)
        env:
          TZ: Asia/Tokyo
        run: |
          flutter test \
            test/features/booking/ \
            test/features/schedule/ \
            test/features/home/ \
            test/features/calendar/ \
            test/shared/formatters/ \
            test/shared/time/ \
            test/shared/calendar/ \
            test/core/time/ \
            test/routing/ \
            --reporter=expanded

      # 2026-08-04 — a FOURTH CI zone, WEST of Kyiv. Added, not swapped in for
      # Asia/Tokyo, because measurement showed the two are complementary rather
      # than redundant.
      #
      # WHAT THIS CATCHES THAT NO GREP CAN
      # ----------------------------------
      # scripts/forbid_host_local_instant_anchor.sh's six rules are all
      # single-file text rules. The bug class they structurally cannot see is
      # CROSS-FILE DATAFLOW: a test file names a host-local instant, hands it to
      # a widget, and the widget converts it through Europe/Kyiv somewhere the
      # test file never references. On 2026-08-04 an attempt to widen that
      # script's Rule 1 to reach this class was MEASURED AND REFUSED — with its
      # stage-1 classifier disabled the matcher returned 74 hits / 1 genuine
      # defect / 73 inert, 1.4% precision, i.e. 73 rubber-stamped annotations
      # (commit 030ddb18, and the refusal is recorded in that script's header).
      # The single defect was found instead by EXECUTING the suite under
      # TZ=Pacific/Honolulu, at precision 1/1 with zero annotations. This step
      # is that execution, wired. It cannot be rubber-stamped: there is no
      # marker to add, only a passing or failing test.
      #
      # WHY HONOLULU IN ADDITION TO TOKYO — MEASURED IN BOTH DIRECTIONS
      # --------------------------------------------------------------
      # For a bare `DateTime(Y,M,D,H)` on a host at UTC+O, the Kyiv wall-clock
      # hour is `H - O + 3`, so the Kyiv calendar day differs from D only when
      # that leaves [0,24). Per zone that is a band of FIXTURE HOURS:
      #   Europe/Kyiv (+3)      none      — the dev VM; blind by construction
      #   UTC          (0)      H >= 21   — the main suite
      #   Asia/Tokyo   (+9)     H <  6    — the step above
      #   Pacific/Honolulu (-10) H >= 11  — this step
      # Tokyo's band and Honolulu's band are DISJOINT, so neither subsumes the
      # other and a swap would lose real coverage. Honolulu's band strictly
      # contains the main UTC suite's.
      #
      # Proven by executed mutation on booking_confirm_test.dart, not derived
      # (2026-08-04). Its `_kStartAt`/`_kEndAt` were reverted to the pre-
      # 030ddb18 host-local spelling and the file run under all four zones:
      #   PROBE A  DateTime(2026,7,20,14)  Kyiv PASS  UTC PASS  Tokyo PASS
      #                                    Honolulu FAIL
      #     — the real defect 030ddb18 fixed. booking_confirm_screen.dart:248
      #       keys its bookingsDayProvider invalidation off
      #       `dateOnly(toBeauticaTime(startAt))`; under Honolulu that instant
      #       is 03:00 the NEXT Kyiv day, so the invalidation targeted a family
      #       member the test never subscribed to. Failure was
      #       `Expected: <2> Actual: <1>` on the "REGRESSION GUARD — ...
      #       invalidates bookingsDayProvider" test. Tokyo does NOT see it.
      #   PROBE B  DateTime(2026,7,20,2)   Kyiv PASS  UTC PASS  Honolulu PASS
      #                                    Tokyo FAIL
      #     — the mirror direction, same defect shape at an early-morning
      #       fixture hour. This is what earns Asia/Tokyo its slot: Honolulu
      #       does NOT see it. Do not "consolidate" the two sweeps into one.
      # A THIRD probe records the residual gap honestly rather than claiming
      # full coverage:
      #   PROBE C  DateTime(2026,7,20,8)   Tokyo PASS  Honolulu PASS
      # Fixture hours 06:00-10:59 are caught by NO zone in this workflow. Only
      # a maximal pair (Pacific/Kiritimati UTC+14 with Pacific/Niue UTC-11)
      # would close it — verified: probe C is RED under Pacific/Kiritimati.
      # Deliberately NOT adopted: it would mean retiring Asia/Tokyo as the CI
      # host zone while a dozen test files still use `tz.getLocation('Asia/
      # Tokyo')` as this codebase's canonical "other zone" idiom, for five
      # fixture hours. Revisit only WITH a fresh full-sweep measurement under
      # both replacement zones — neither has ever been run at this scope.
      #
      # Pacific/Honolulu specifically: UTC-10 and — like Asia/Tokyo, unlike
      # Europe/Kyiv — it observes NO DST, so its offset is constant year-round
      # and the verdict stays a property of the CODE, never of the calendar
      # date the runner happens to execute on.
      #
      # COST, MEASURED (2026-08-04, dev VM, this exact scope, current tree):
      #   TZ=Asia/Tokyo        2413 passed, 5 skipped, 0 failed, real 6m01.457s
      #   TZ=Pacific/Honolulu  2413 passed, 5 skipped, 0 failed, real 5m56.630s
      # The two zones cost the same, so this step adds ~1x the Tokyo step.
      #
      # It does NOT "double test wall time" — a claim made when this step was
      # first proposed, and measured to be wrong. The denominator was measured
      # too, same machine, same tree: the main `Test` step above
      # (`flutter test --coverage --exclude-tags golden`, the whole suite) is
      # 5493 passed, 3 skipped, real 22m47.850s. So the zone-sensitive part of
      # this job goes from ~29m (main + Kyiv rail file + Tokyo) to ~35m — about
      # +20%, not +100%. Re-measure both numbers before re-litigating the cost;
      # the earlier 3m44s Tokyo figure in the step above is from the 2026-08-02
      # tree and no longer comparable (2311 tests then, 2413 now).
      #
      # The 5 skips are bookings_day_rail_test.dart's DST-transition guards, which
      # need a host whose offset changes — same reason they skip under Tokyo
      # and under the main UTC suite. It is GREEN on the current tree: the
      # defect it originally found is already fixed in 030ddb18, so this is a
      # gate against regression, not a live bug hunt. Scope is deliberately the
      # SAME directory list as the Tokyo step — see that step's SCOPE DECISION
      # and REJECTED ALTERNATIVE notes; both apply verbatim here, and the two
      # lists must be kept identical so a directory added to one is not
      # silently uncovered in the other direction.
      #
      # Step-level `env:` — never job-level, for the reason spelled out on the
      # DST rail guards step. Pinned by test/ci/dst_rail_ci_coverage_test.dart;
      # deleting this step fails that test.
      - name: Fourth-timezone sweep (west-of-Kyiv day-boundary detector)
        env:
          TZ: Pacific/Honolulu
        run: |
          flutter test \
            test/features/booking/ \
            test/features/schedule/ \
            test/features/home/ \
            test/features/calendar/ \
            test/shared/formatters/ \
            test/shared/time/ \
            test/shared/calendar/ \
            test/core/time/ \
            test/routing/ \
            --reporter=expanded

      # Phase 17.4 — Golden regression suite.
      # Runs the alchemist CI goldens (obscureText=true, renderShadows=false)
      # against the committed masters in test/golden/goldens/.
      # On failure, golden-diff PNGs are collected from the framework's default
      # failures/ subdirectory (alchemist writes isolatedDiff, maskedDiff,
      # masterImage, testImage to <test-file-dir>/failures/) and uploaded so
      # reviewers can inspect regressions without pulling the branch locally.
      - name: Golden regression tests
        run: flutter test test/golden/ --reporter=expanded

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: golden-failure-diffs-${{ github.event.pull_request.number || github.run_number }}
          # All golden tests live directly under test/golden/, so alchemist only
          # ever writes test/golden/failures/. The recursive **/failures/ glob
          # matched nothing and was removed (PERF INFO).
          path: |
            test/golden/failures/
          if-no-files-found: ignore
          retention-days: 14

      # Decode the release keystore from the base64 secret.
      # Skipped silently on forks / branches where the secret is absent.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BEAUTICA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode \
              > "$GITHUB_WORKSPACE/beautica-release.jks"
            echo "Keystore decoded ✅"
          else
            echo "BEAUTICA_KEYSTORE_BASE64 not set — skipping release signing"
          fi

      - name: Build APK (debug)
        env:
          # NO /api/v1 suffix — the generated OpenAPI client and raw Dio calls
          # already prepend /api/v1/. A suffix here double-prefixes every URL
          # (.../api/v1/api/v1/...) → 404. Contract pinned by
          # test/core/config/app_config_path_test.dart.
          BEAUTICA_BASE_URL: https://beautica-backend-production.up.railway.app
        run: |
          flutter build apk --debug \
            --dart-define=BEAUTICA_BASE_URL="$BEAUTICA_BASE_URL"

      - name: Build APK (release)
        env:
          # NO /api/v1 suffix — see the debug build note above. Double-prefix → 404.
          BEAUTICA_BASE_URL: https://beautica-backend-production.up.railway.app
          BEAUTICA_KEYSTORE_PATH: ${{ github.workspace }}/beautica-release.jks
          BEAUTICA_KEYSTORE_PASSWORD: ${{ secrets.BEAUTICA_KEYSTORE_PASSWORD }}
          BEAUTICA_KEY_ALIAS: ${{ secrets.BEAUTICA_KEY_ALIAS }}
          BEAUTICA_KEY_PASSWORD: ${{ secrets.BEAUTICA_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=BEAUTICA_BASE_URL="$BEAUTICA_BASE_URL"

      # APK artifact uploads are intentionally disabled (2026-07-06) to save
      # GitHub Actions artifact storage quota — the builds above already
      # confirm the debug/release APKs compile cleanly, which is all this job
      # needs pre-release. Re-enable both `actions/upload-artifact` steps
      # (see git history for this file) once we're close to a release and
      # need a downloadable build.

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # End-to-end integration tests (Fix 4, 2026-06-02).
  #
  # integration_test/ drives the REAL app widget tree (real screens + real
  # notifiers + real repository + real generated client + real serialization)
  # with ONLY the Dio transport socket faked by http_mock_adapter — no live
  # backend. IntegrationTestWidgetsFlutterBinding requires a device, so this job
  # boots a headless Android emulator (KVM-accelerated on the runner) and runs:
  #   flutter test integration_test/
  #
  # Run locally against a connected emulator (see scripts/connect_adb.sh) with:
  #   flutter test integration_test/edit_profile_flow_test.dart
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests (emulator)
    runs-on: ubuntu-latest
    # Backstop for the backstop. Each of the six invocations below is
    # individually `timeout`-bounded (see part 1 attempt 1), so this only has
    # to cover the case where the emulator action itself wedges outside the
    # `script:` block. Without it the job inherits GitHub's 6-HOUR default.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # KVM is required for hardware-accelerated emulator boot on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ROOT CAUSE + FIX (2026-07-07 — see docs/ci_investigation_notes.md for
      # the full overnight investigation trail). This step used to run once.
      # A 2026-07-01 incident found it crashing the emulator at final
      # teardown ("adb: device offline" right after the LAST flow's own
      # assertions all logged ✅) and bisected it to commit 7307721. The
      # 2026-07-06/07 follow-up investigation falsified that bisection and
      # several other theories (Home-Hub-specific rendering, cumulative
      # relaunch count, API 34/35 instability, Flutter SDK drift) via
      # systematic isolation, then confirmed the real mechanism: GitHub's
      # headless emulator (goldfish-opengl / swiftshader_indirect) releases
      # an app relaunch's GL ColorBuffer handles ASYNCHRONOUSLY host-side; a
      # NEW relaunch starting before that cleanup finishes crashes the WHOLE
      # emulator (`Failed to find ColorBuffer` -> `adb: device offline`,
      # unrecoverable — `adb emu kill` itself can't connect) instead of just
      # logging a warning. This is a documented, UNRESOLVED upstream bug —
      # see ReactiveCircus/android-emulator-runner#358 and
      # flutter/flutter#153445/#140001/#146890 (Google's own LUCI CI hits the
      # identical crash class with no confirmed permanent fix).
      #
      # Mitigations, layered (see docs/ci_investigation_notes.md for the full
      # trail, including two rounds that turned out NOT to fully explain it):
      #   1. A 2s settle delay in `AppHarness.tearDownHarness()` /
      #      `PatrolHarness.tearDownHarness()` (integration_test/support/,
      #      integration_test/patrol/support/) — the ONE shared choke point
      #      every flow file already calls via
      #      `tearDown(AppHarness.tearDownHarness)`. Reduces (but does not
      #      eliminate) the incidence of the stall.
      #   2. `sleep 15` between the two `flutter test` invocations below —
      #      harmless, but confirmed NOT to be the deciding factor: the crash
      #      still fires WITHIN `all_tests_part1.dart` itself (the 1st→2nd
      #      relaunch transition inside that one process), never actually
      #      reaching this sleep.
      #   3. THE ACTUAL FIX — success detection by log content, not shell
      #      exit code. Confirmed on repeated samples: the 1st→2nd relaunch
      #      transition inside `all_tests_part1.dart` always logs `Failed to
      #      find ColorBuffer`, stalls ~35-40s, then EVERY ONE of the file's
      #      39 relaunches completes and logs ✅ — but the adb/emulator link
      #      is left wedged, so the file's OWN final teardown/uninstall then
      #      fails hard (`adb: device offline`, unrecoverable — `adb emu
      #      kill` itself can't connect), well AFTER every real assertion in
      #      the file already passed. This can ALSO kill `flutter test`
      #      itself before it prints its own `🎉 N tests passed.` summary
      #      (confirmed: a run with all 39 ✅ present had NO 🎉 in the log,
      #      so gating on that marker alone is too fragile — it depends on
      #      the process surviving long enough to flush it). A real
      #      assertion failure, by contrast, ALWAYS prints `EXCEPTION CAUGHT
      #      BY FLUTTER TEST FRAMEWORK` synchronously, at the moment of
      #      failure — unaffected by anything that happens later (confirmed
      #      via the unrelated logout_flow_test.dart bug found during this
      #      investigation, backlogged separately). So: capture each
      #      invocation's own output, and gate on the ABSENCE of that
      #      exception banner (plus a sanity check that at least one ✅ was
      #      logged at all, in case of a crash before any test could run) —
      #      not the process exit code, which is polluted by this separate,
      #      well-documented, UNRESOLVED upstream emulator bug
      #      (ReactiveCircus/android-emulator-runner#358,
      #      flutter/flutter#153445/#140001/#146890 — Google's own LUCI CI
      #      hits the identical crash class with no confirmed permanent fix)
      #      that fires strictly AFTER the tests it's supposedly reporting on.
      # Retry the WHOLE step (fresh emulator boot each attempt) up to 3 times
      # regardless, as defense-in-depth for the rarer case where the crash
      # happens mid-run rather than at final teardown (no ✅ ever logged, or
      # a real exception banner) — genuinely not masked by mitigation 3
      # and still fails the attempt).
      # DECOUPLED PART BOOTS (2026-07-07, round 6): part1 and part2 EACH get
      # their own independent emulator boot + 3x retry, instead of sharing
      # one boot with a sleep in between. Confirmed necessary: part1's crash
      # doesn't just wedge the adb link, it kills the WHOLE emulator process
      # (part2 then fails with flutter's own "No supported devices
      # connected" — no `sleep` duration fixes that, since there's no
      # device left to wait for). Splitting into separate boots means
      # part1's crash has zero effect on part2's own fresh attempts.
      - name: Run integration tests — part 1 (attempt 1)
        id: it-part1-attempt-1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # ram-size/heap-size (2026-07-01): harmless baseline bump, kept even
          # though investigation showed memory pressure was never the actual
          # cause. cores is left at the action default (2) since GitHub-hosted
          # ubuntu-latest runners have 2 vCPUs.
          ram-size: 4096M
          heap-size: 512M
          # NOTE: directory-mode batching (`flutter test integration_test/`) does
          # NOT work — it launches the app once and cannot relaunch between files
          # ("Unable to start the app on the device" after the first flow). Each
          # AGGREGATING FILE below works the same way the original single file
          # did: one isolate per invocation, harness re-launches per testWidgets.
          #
          # The PROFILE-MODE drive leg that used to run here was split into the
          # separate `integration-profile` job below (2026-06-18, finding 6) so
          # its slow AOT compile no longer blocks every PR's critical path. This
          # fast debug pass stays per-PR.
          #
          # EXTERNAL `timeout` (2026-08-17) — on every one of the six invocations
          # below, not just this one. An `integration_test/` flow CAN hang with
          # no bound whatsoever: `IntegrationTestWidgetsFlutterBinding` sets
          # `defaultTestTimeout = Timeout.none`, and every bound the harness owns
          # (`AppHarness.settle`'s `Future.timeout`, `pumpAndSettle`'s internal
          # deadline, the `pumpUntil*` poll deadlines, an explicit per-test
          # `Timeout`) is a TIMER — none of which tick once a synchronous
          # allocating build loop has starved the isolate's event loop. That is
          # not theoretical: `master_archive_flow_test.dart` scenario 2 ran
          # unbounded on 2026-08-17 and nothing in-isolate could stop it. A
          # bound OUTSIDE the process is the only kind that works, which is why
          # this is `timeout(1)` and not another Dart-side constant.
          #
          # 1500 s is per INVOCATION (one aggregated part, ~15 flows in one
          # isolate) — generous against a healthy run, useless as a hang. It
          # also composes with the per-attempt retry design: a hung attempt 1
          # aborts at 25 min and attempt 2 still gets its own fresh emulator,
          # which a job-level bound alone could not give.
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part1.dart > part1.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part1.log; echo "PART 1: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part1.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part1.log && { echo "PART 1: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part1.log || { echo "PART 1: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 1: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Run integration tests — part 1 (attempt 2)
        id: it-part1-attempt-2
        if: steps.it-part1-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part1.dart > part1.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part1.log; echo "PART 1: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part1.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part1.log && { echo "PART 1: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part1.log || { echo "PART 1: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 1: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Run integration tests — part 1 (attempt 3)
        id: it-part1-attempt-3
        if: steps.it-part1-attempt-1.outcome == 'failure' && steps.it-part1-attempt-2.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part1.dart > part1.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part1.log; echo "PART 1: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part1.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part1.log && { echo "PART 1: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part1.log || { echo "PART 1: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 1: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Run integration tests — part 2 (attempt 1)
        id: it-part2-attempt-1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part2.dart > part2.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part2.log; echo "PART 2: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part2.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part2.log && { echo "PART 2: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part2.log || { echo "PART 2: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 2: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Run integration tests — part 2 (attempt 2)
        id: it-part2-attempt-2
        if: steps.it-part2-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part2.dart > part2.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part2.log; echo "PART 2: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part2.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part2.log && { echo "PART 2: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part2.log || { echo "PART 2: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 2: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Run integration tests — part 2 (attempt 3)
        id: it-part2-attempt-3
        if: steps.it-part2-attempt-1.outcome == 'failure' && steps.it-part2-attempt-2.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          script: |
            timeout --signal=TERM --kill-after=60 1500 flutter test integration_test/all_tests_part2.dart > part2.log 2>&1; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then cat part2.log; echo "PART 2: TIMED OUT after 1500s (rc=$RC). This bound is EXTERNAL on purpose: no in-isolate bound can catch event-loop starvation. Future.timeout, pumpAndSettle's own deadline, pumpUntil* poll deadlines and defaultTestTimeout are ALL timers, and a timer never fires while a synchronous allocating loop holds the isolate (see AppHarness.settle's doc). A healthy part is far under this bound, so treat 124/137 as a HANG, not slowness: find the last flow that logged and look for an unbounded synchronous build (e.g. a per-hour/per-row loop driven by out-of-window data)."; exit 1; fi; true
            cat part2.log
            grep -q "EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK" part2.log && { echo "PART 2: FAILED — a real test assertion/exception was logged."; exit 1; }; grep -q "✅" part2.log || { echo "PART 2: FAILED — no test assertions logged at all (crashed before any test could even start)."; exit 1; }; echo "PART 2: no test failures logged (any process-level crash after this point is the known upstream emulator teardown bug, not a real failure)."

      - name: Verify integration tests passed on some attempt
        if: always()
        run: |
          if [[ "${{ steps.it-part1-attempt-1.outcome }}" == "success" || "${{ steps.it-part1-attempt-2.outcome }}" == "success" || "${{ steps.it-part1-attempt-3.outcome }}" == "success" ]]; then
            echo "PART 1: passed."
            part1_ok=1
          else
            echo "PART 1: all 3 attempts failed."
            part1_ok=0
          fi
          if [[ "${{ steps.it-part2-attempt-1.outcome }}" == "success" || "${{ steps.it-part2-attempt-2.outcome }}" == "success" || "${{ steps.it-part2-attempt-3.outcome }}" == "success" ]]; then
            echo "PART 2: passed."
            part2_ok=1
          else
            echo "PART 2: all 3 attempts failed."
            part2_ok=0
          fi
          if [[ "$part1_ok" == "1" && "$part2_ok" == "1" ]]; then
            echo "Both parts passed."
          else
            echo "At least one part failed all 3 attempts — either a real test" \
                 "regression, or an exceptionally unlucky run of the known" \
                 "upstream emulator flake (docs/ci_investigation_notes.md)." \
                 "Check the attempt logs above: a genuine test failure shows" \
                 "'EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK'; the known flake" \
                 "shows every assertion passing followed by 'adb: device" \
                 "offline' / 'Failed to find ColorBuffer' / 'No supported" \
                 "devices connected'."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Profile-mode integration drive (2026-06-18 debug↔release divergence
  # safeguard; finding 6).
  #
  # `flutter test` ALWAYS runs JIT/debug with asserts ON; it has no
  # `--profile`/`--release` flag (verified: "Could not find an option named
  # --profile"). So the fast `integration` job above only catches "debug-fails /
  # release-works" (our logout CircularDependencyError). To ALSO catch the
  # INVERSE — "release-fails / debug-works", where a STRIPPED assert changes
  # behaviour on a critical flow — we re-run the logout/auth-cascade flow in
  # PROFILE mode via `flutter drive` (asserts stripped, AOT, release-like). It is
  # scoped to logout_flow_test (the critical auth-cascade flow) to keep the AOT
  # compile bounded.
  #
  # WHAT THIS JOB ACTUALLY RE-GUARDS (corrected 2026-07-22 — the earlier
  # wording above overstated it). It does NOT re-guard the
  # CircularDependencyError that `logout_flow_test.dart` was written for:
  # Riverpod's `_debugAssertCanDependOn` is `kDebugMode`-only, so with asserts
  # stripped that specific regression CANNOT fire here — in profile this test
  # can never fail for its own stated reason. What the job legitimately is:
  # a "does the critical auth flow still work end-to-end with asserts OFF"
  # smoke test. Its value is the assert-stripping-changes-behaviour class in
  # general, and it has already paid for itself once — it is how the silent
  # `enterText` drop was found (`tester.enterText` no-ops in profile unless the
  # harness registers the text-input mock; see
  # `scripts/forbid_missing_test_text_input.sh`). Do not describe this job as
  # the profile-mode counterpart of the cyclic-invalidation guard; it isn't.
  #
  # DO NOT ADD SCREENSHOT CAPTURE HERE — it will only ever produce black
  # frames. `LoginScreen.initState` acquires `screenProtectionProvider`, whose
  # `_enable()` starts with `if (kDebugMode) return;` (see
  # `lib/core/security/screen_protection.dart`). So FLAG_SECURE is set in
  # PROFILE but not in debug, and `adb shell screencap` on this job returns an
  # all-black image (confirmed on a physical device, 2026-07-22). Debug this
  # job from `adb logcat` / the driver's stdout, not from screenshots.
  #
  # WHY THIS JOB IS GATED (not per-PR), matching the `patrol` job idiom exactly:
  #   The profile AOT compile adds ~1.5–3 min to the critical path on every PR.
  #   The inverse-divergence class it guards is rare and the auth flow changes
  #   seldom, so per-PR cost is not justified. It therefore runs only on:
  #     • the nightly `schedule` trigger,
  #     • manual `workflow_dispatch`,
  #     • PRs explicitly labelled `run-patrol` (the same opt-in label the patrol
  #       native-E2E job uses — both are the heavy emulator-AOT tier).
  #   It is a SEPARATE job, so it never blocks the fast `validate` /
  #   `integration` jobs, and the per-PR debug `flutter test integration_test/
  #   all_tests.dart` pass in `integration` is untouched.
  integration-profile:
    name: Integration profile drive (emulator)
    runs-on: ubuntu-latest
    # Skip on ordinary push/PR; opt in via schedule, manual dispatch, or label —
    # mirrors the `patrol` job's gating idiom.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-patrol'))
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # KVM is required for hardware-accelerated emulator boot on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run logout flow in profile mode on emulator
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # AOT, asserts stripped, release-like — the inverse of the debug
          # `flutter test` pass. Uses the standard host driver in
          # test_driver/integration_test.dart.
          #
          # ONE PHYSICAL LINE, deliberately — do NOT reformat with backslash
          # continuations for readability. android-emulator-runner executes each
          # physical line of `script:` as its own `sh -c` invocation, so a
          # trailing `\` is passed as a literal argument rather than continuing
          # the command: `flutter drive \` alone yields `Target file "\" not
          # found.` and the job dies before the driver starts. The `integration`
          # job above follows the same rule (long single lines joined with `;`).
          # This bit us for real: the job is label-gated, so the break sat
          # undetected from 2026-07-07 until a `run-patrol` label first ran it.
          script: |
            timeout --signal=TERM --kill-after=60 900 flutter drive --profile --driver=test_driver/integration_test.dart --target=integration_test/logout_flow_test.dart; RC=$?; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then echo "PROFILE DRIVE: TIMED OUT after 900s (rc=$RC). External bound — an in-isolate one cannot catch event-loop starvation; see the part1/part2 note in the integration job above."; fi; exit $RC

  # ---------------------------------------------------------------------------
  # Native-surface change detection — the additive gate for the `patrol` job.
  #
  # GitHub cannot combine a workflow-level `paths:` filter with a job-level
  # `if:`, so change detection has to be its own job whose output the `patrol`
  # job's `if:` consumes.
  #
  # This job ALWAYS runs (it is cheap: checkout + one filter step). The filter
  # step itself only runs on `pull_request`, because that is the only event
  # with a meaningful diff to filter. On `schedule` / `workflow_dispatch` /
  # `push` the step is skipped and `steps.filter.outputs.native` is the empty
  # string, so `needs.changes.outputs.native == 'true'` is false and the
  # scheduled run falls through to its own unconditional clause in `patrol`'s
  # `if:` — i.e. the nightly is NEVER gated on a diff.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect native-surface changes
    runs-on: ubuntu-latest
    # dorny/paths-filter reads the PR file list via the API on pull_request.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Filter native-surface paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        with:
          # Everything here genuinely changes what the patrol flows exercise.
          # Keep this list TIGHT — a false positive costs a full emulator boot.
          filters: |
            native:
              # Whole Android shell: manifests (App-Link intent filters +
              # flutter_deeplinking_enabled), Gradle/AGP config, res/xml
              # network_security_config, signing, ProGuard.
              - 'android/**'
              # Redundant with android/** today, but keeps the gate correct if
              # a manifest is ever added outside android/.
              - '**/AndroidManifest.xml'
              # The patrol flows themselves + their support helpers.
              - 'integration_test/patrol/**'
              # go_router config: the deep-link flow asserts that an App Link
              # actually RESOLVES to the right screen, so a route change can
              # break the native test without touching android/.
              - 'lib/routing/**'
              # App bootstrap — decides what the cold-start intent lands on.
              - 'lib/main.dart'
              # patrol / flutter pins and `test_directory`, which control what
              # the native test bundle even contains.
              - 'pubspec.yaml'
              # The job definition itself.
              - '.github/workflows/pr-validate.yml'

  # ---------------------------------------------------------------------------
  # Patrol native E2E (Phase 17.5).
  #
  # Covers OS-level surfaces integration_test cannot reach (deep-link intents,
  # permission dialogs, notifications, WebViews) via patrol's `$.native.*`.
  # Tests live under integration_test/patrol/ and run through native
  # instrumentation (PatrolJUnitRunner) driven by the patrol_cli global tool —
  # NOT `flutter test`. The headless `integration` job above is unaffected: the
  # all_tests.dart aggregator does not import anything under patrol/.
  #
  # WHY THIS JOB IS GATED (not per-PR):
  #   The native compile builds the androidTest variant + AndroidX Test
  #   Orchestrator and boots a full emulator — materially slower than the fast
  #   jobs. Running it on every PR is not justified, so it runs only on:
  #     • the nightly `schedule` trigger,
  #     • manual `workflow_dispatch`,
  #     • PRs explicitly labelled `run-patrol`,
  #     • PRs that touch a native surface (see the `changes` job's filter).
  #   It is a SEPARATE job, so it never blocks or merges into the fast
  #   `validate` / `integration` jobs.
  #
  #   The last clause was added because label-only opt-in meant a PR that broke
  #   App Link routing merged green — nobody remembers to add a label for a
  #   regression they do not know they are introducing.
  #
  # EXPECTED OUTCOME PER TRIGGER (all five cases the `if:` must get right):
  #   1. schedule            -> RUNS (clause 1; never gated on a diff)
  #   2. workflow_dispatch   -> RUNS (clause 2)
  #   3. PR + `run-patrol`   -> RUNS (clause 3, label branch)
  #   4. PR touching native  -> RUNS (clause 3, changed-paths branch)
  #   5. any other PR / push -> SKIPPED (no clause matches; `push` is
  #                             deliberately absent — its PR already covered it)
  patrol:
    name: Patrol native E2E (emulator) (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # Bound the job. Without this it inherits GitHub's 6-hour default, and a
    # hung emulator burns six hours of runner time before anyone notices. On
    # 2026-07-22 this job sat ~90 minutes on the test step before the emulator
    # died; a healthy run is well under 30. 45 gives generous headroom for a
    # cold native compile without letting a hang run away.
    timeout-minutes: 45
    # Matrix axis: API 34 only. API 29 was dropped — its x86_64 system image
    # crashes with a native jemalloc SIGSEGV during native-thread creation
    # (art::Thread::CreateNativeThread → je_malloc) before any patrol test runs.
    # The same APK runs clean on API 34, so the crash is the emulator image, not
    # app code. The deep-link test asserts App Links routing, and the strict
    # path that can actually break is Android 12+ (API 31+) — already covered by
    # API 34. (minSdk is 26; re-add API 29 pinned to a known-good image on a
    # continue-on-error leg if pre-12 coverage is later needed.)
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    # `changes` always succeeds, so gating on it cannot silently skip patrol;
    # it only makes the changed-paths output available to the `if:` below.
    needs: changes
    # Skip on ordinary push/PR; run on schedule, manual dispatch, the opt-in
    # label, or a PR that touches a native surface. See the per-trigger table
    # in the comment block above.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.labels.*.name, 'run-patrol') ||
        needs.changes.outputs.native == 'true'))
    steps:
      # =====================================================================
      # !!! PRE-RELEASE ONLY — MUST BE FLIPPED BACK TO `main` AT RELEASE !!!
      #
      # `ref: dev` on the SCHEDULED run is deliberate, not a mistake.
      #
      # WHY: GitHub runs `schedule` workflows only from the DEFAULT BRANCH,
      # which is `main`. During development nothing is committed to `main`
      # directly — all work targets `dev` — so an unpinned nightly would
      # exercise a stale `main` while real regressions sat on `dev`, caught
      # neither per-PR (this job is gated) nor nightly. That is the exact hole
      # this pin closes.
      #
      # AT RELEASE: when `main` becomes the branch that actually ships, delete
      # the `with:` block below (reverting to the default-branch checkout) or
      # change 'dev' to 'main'. Leaving it pinned to `dev` post-release means
      # the nightly silently stops testing what users run.
      #
      # SCOPE: the override applies ONLY to `schedule`. For `pull_request` and
      # `workflow_dispatch` the ref MUST stay empty so checkout uses the
      # triggering ref — pinning `dev` unconditionally would make a labelled
      # or native-path PR test `dev` instead of the PR head, i.e. report a
      # green patrol run for code that was never built.
      #
      # Tracked in docs/mobile-phases/mobile-backlog.md → Pre-release checklist.
      # =====================================================================
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # patrol_cli is a GLOBAL tool — intentionally not a repo dependency.
      #
      # PIN THE EXACT VERSION. patrol_cli and the `patrol` package ship a
      # hard compatibility check: the CLI refuses to run against a package
      # version it does not declare support for, and the pairing is exact,
      # not semver-compatible. patrol_cli 4.5.x requires `patrol` 4.7.0
      # ("This version requires version `4.7.0` of `patrol` package", CLI
      # 4.5.0 changelog); 4.4.0 paired with patrol 4.6.x.
      #
      # This line previously read `dart pub global activate patrol_cli` with
      # NO constraint, while the comment above it claimed a major-version
      # pin. It was unpinned in fact. On 2026-07-22 the CLI moved to 4.5.1
      # while pubspec still had `patrol: ^4.6.1`, and the job died with
      # "Patrol version 4.6.1 ... is not compatible with patrol_cli version
      # 4.5.1". Because the job is `run-patrol`-gated it had never run on an
      # ordinary PR, so the break surfaced only when the label was applied.
      #
      # Bump BOTH together, never one: this pin and `patrol:` in pubspec.yaml.
      - name: Install patrol_cli
        run: |
          dart pub global activate patrol_cli 4.5.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: patrol doctor
        run: patrol doctor

      # KVM is required for hardware-accelerated emulator boot on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run patrol native tests on emulator
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009  # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          # Scope to integration_test/patrol so patrol only bundles the
          # patrolTest flows. With test_directory: integration_test in
          # pubspec.yaml, a bare `patrol test` would also discover the 5
          # non-patrol flow files + all_tests.dart (testWidgets, not
          # patrolTest) — those stay on the fast headless `integration` job.
          # The FCM cases are skip-marked at the Dart level (Firebase deferred)
          # so they report as skipped, not failed.
          script: |
            # Capture full device logcat in the background so a crash stack
            # (Process crashed → FATAL EXCEPTION) survives — patrol/gradle only
            # surface "Process crashed", not the device-side stack. Backgrounded
            # on its own line so it survives this line's sh -c exit.
            adb logcat -c || true; adb logcat -b all -v time > "$GITHUB_WORKSPACE/patrol-logcat.txt" 2>&1 &
            # Keep the ADB-install verifier out of the way during patrol's reinstall.
            adb shell settings put global verifier_verify_adb_installs 0 || true
            # BACKGROUND RE-APPROVAL LOOP (load-bearing fix). patrol test rebuilds +
            # reinstalls the app right before running, which WIPES App Link approval,
            # so a one-shot pre-approval is gone by the time openUrl fires (deep-link
            # test runs 3rd). This loop re-asserts STATE_APPROVED for both default
            # and user scope, so whenever patrol's reinstall lands the domain is
            # re-approved before the intent is fired.
            #
            # CADENCE IS 5s, NOT 1s — do not tighten it back. On 2026-07-22, the
            # first run in which this job ever reached the tests (a CLI version
            # mismatch had killed it earlier, so the loop had never actually run in
            # anger), the emulator died mid-suite with
            # `device 'emulator-5554' not found` and
            # `[EmulatorConsole]: Failed to start Emulator console for 5554` BEFORE
            # any test started. Patrol reported 0 test failures — 1 passed, 2
            # skipped, and the run simply lost its device. In that SAME workflow
            # run, on the same runner image, same emulator-runner action and same
            # API 34, the `integration` job — which runs NO adb loop — passed a
            # 15-minute suite on its own emulator.
            #
            # CADENCE IS 1s AND MUST STAY 1s. It was introduced at 1s by
            # 3e7dc9c ("keep App Link approved during patrol run") precisely to
            # win the race against patrol's reinstall, and it is the reason the
            # deep-link test passes at all.
            #
            # DO NOT SLOW IT DOWN. On 2026-07-22 it was cut 5x (1s -> 5s) on a
            # hypothesis that adb contention from this loop was killing the
            # emulator. That hypothesis was TESTED AND DISPROVEN — the next run
            # failed byte-for-byte identically, same test, ~87s, same
            # `device 'emulator-5554' not found`. The device loss is unrelated
            # to this loop (it is bisect-confirmed to be the CLIENT test's
            # client-shell mount; see auth_login_patrol_test.dart).
            #
            # But the slowdown was not free: the deep-link test failed on every
            # run while the cadence was 5s. Losing the approval race means the
            # URL opens in a BROWSER, the app is backgrounded, and the Flutter
            # engine stops producing frames — so the test does not fail fast, it
            # HANGS, because `pump()` blocks forever waiting for a frame that
            # never comes. That is what the 900s `timeout` below caught.
            #
            # Lesson worth keeping: this loop is load-bearing for the deep-link
            # test, and it was slowed to chase a defect in a different test.
            #
            # What the evidence actually shows, for whoever picks this up: the
            # failure is DETERMINISTIC, not the intermittent flake this repo has
            # classified it as since 2026-07-01. Two runs on two commits both
            # died at the same point — test 1 passes in 6s, test 2 kills the
            # device — with patrol reporting ZERO failed assertions. The captured
            # logcat contains no `beautica` lines at all and ends during boot
            # chatter, so the background `adb logcat` lost the device before the
            # app even started, and `[EmulatorConsole]: Failed to start Emulator
            # console for 5554` prints before any test runs. `patrol doctor` also
            # reports `Program adb not found` while $ANDROID_HOME is set, so
            # patrol_cli, the emulator-runner action and Gradle's ddmlib may not
            # all be resolving the same adb. That mismatch is UNVERIFIED — it is
            # a direction, not a diagnosis.
            #
            # It STOPS the instant patrol finishes, via the sentinel file written on
            # the patrol line below — the emulator-runner action waits for backgrounded
            # children, so a loop that kept spinning would hang the step for minutes
            # after the tests already passed (observed). Each adb call is `timeout`-
            # bounded so a call can never wedge, and the loop is iteration-capped as a
            # final backstop. NOT pkill'd — `pkill -f` would match its own argv and
            # SIGTERM the cleanup shell ("exit code null"). Must be ONE self-contained
            # line so the `&` background survives this line's own sh -c.
            rm -f /tmp/patrol_approve_done || true
            ( i=0; while [ ! -f /tmp/patrol_approve_done ] && [ "$i" -lt 1200 ]; do out1=$(timeout 10 adb shell pm set-app-links --package com.beautica.beautica_mobile 2 beautica-backend-production.up.railway.app 2>&1); rc1=$?; out2=$(timeout 10 adb shell pm set-app-links-user-selection --user 0 --package com.beautica.beautica_mobile true beautica-backend-production.up.railway.app 2>&1); rc2=$?; if [ "$rc1" -ne 0 ] || [ -n "$out1" ] || [ "$rc2" -ne 0 ] || [ -n "$out2" ]; then echo "APPROVE-LOOP iter=$i set-app-links rc=$rc1 out=[$out1] user-selection rc=$rc2 out=[$out2]" >> /tmp/patrol_approve.log; fi; i=$((i+1)); sleep 1; done ) &
            patrol build android --target integration_test/patrol
            # DIAGNOSTIC: the real domain-verification state, right before the
            # suite runs. If the deep-link test still routes to a browser, this
            # is the line that says why — look for the domain under "Selection
            # state" / whether it reads as approved for user 0.
            echo "=== pm get-app-links (pre-test) ==="; adb shell pm get-app-links com.beautica.beautica_mobile 2>&1 || true
            # Run patrol, capture its exit, signal the loop to stop, then exit with
            # patrol's real code — all on ONE line so the exit status carries
            # (android-emulator-runner runs each line in its own sh -c, so a separate
            # CODE=$?/exit would not). This makes the step's result equal patrol's.
            timeout --signal=TERM --kill-after=60 900 patrol test --target integration_test/patrol --verbose; RC=$?; : > /tmp/patrol_approve_done; if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then echo "PATROL TIMED OUT after 900s (rc=$RC). A healthy suite is ~10min, so this is a hang, not slowness. Two causes seen so far, and the logcat (uploaded on always()) tells them apart: (1) the DEEP-LINK test hanging because App Link approval was lost, so the URL opened in a browser, the app was backgrounded, and pump() blocked forever waiting for a frame the stopped engine never produced — check the re-approval loop above is still at 1s; (2) patrol_cli stuck on its post-run uninstall against a wedged adb link, which looks like the suite finishing and then nothing."; fi; exit $RC

      - name: Collect emulator host-side diagnostics
        # The gfxstream/swiftshader ColorBuffer race this repo has chased for
        # weeks announces itself on the EMULATOR PROCESS's own stdout
        # ("Failed to find ColorBuffer"), which is NOT reachable from here: the
        # emulator is launched by android-emulator-runner, so its stdout goes to
        # that action's log group and there is nothing to tee. Do not add a
        # `| tee` to the script expecting to catch it — it will silently capture
        # nothing, which is worse than not trying.
        #
        # What IS reachable is collected below: the emulator's host-side log and
        # crash files, plus the GL/gfxstream chatter that does reach logcat
        # (EGL_emulation / emuglGLESv2 / gralloc tags). Combined with the always-
        # uploaded device logcat, that is the best evidence available without
        # patching the action itself.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p emulator-diag
          for d in /tmp/android-"$USER" /tmp/android-unknown "$HOME"/.android; do
            [ -d "$d" ] && find "$d" -maxdepth 2 -type f \( -name '*.log' -o -name '*crash*' -o -name '*.ini' \) \
              -exec cp --parents {} emulator-diag/ \; 2>/dev/null || true
          done
          # GL / gfxstream lines that DID make it into the device log.
          grep -aiE 'ColorBuffer|gfxstream|emuglGLES|EGL_emulation|gralloc|swiftshader' \
            patrol-logcat.txt > emulator-diag/gl-chatter.txt 2>/dev/null || true
          # App Link approval: the loop's own failures (only written when a
          # command errors or emits output), plus the final verification state.
          cp /tmp/patrol_approve.log emulator-diag/ 2>/dev/null || true
          adb shell pm get-app-links com.beautica.beautica_mobile \
            > emulator-diag/app-links-final.txt 2>&1 || true
          grep -aiE 'VIEW|BROWSABLE|webview_shell|assetlinks|DomainVerification|set-app-links' \
            patrol-logcat.txt > emulator-diag/deeplink-chatter.txt 2>/dev/null || true
          echo "collected:"; find emulator-diag -type f | head -40

      - name: Upload patrol device logcat
        # `always()`, NOT `failure()`. This gate cost a real investigation:
        # runs #292/#293 lost the emulator mid-suite, but `patrol test` HUNG on
        # its post-run uninstall and the jobs were cancelled rather than failing.
        # `failure()` is FALSE on cancellation, so neither run uploaded anything,
        # and the newest artifact on the shelf was from #291 — a run that had
        # died on a CLI version check before any test executed. Its logcat held
        # ten seconds of boot chatter and zero app lines, which was then read as
        # evidence about a failure it had never observed.
        #
        # A diagnostic artifact must survive the failure modes it exists to
        # diagnose. Cancellation and timeout are exactly when it is needed most.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          # Per-API suffix keeps the artifact name unique across the parallel
          # matrix jobs — actions/upload-artifact requires unique names.
          name: patrol-logcat-${{ github.run_number }}-api${{ matrix.api-level }}
          path: |
            patrol-logcat.txt
            emulator-diag/
          if-no-files-found: ignore
          retention-days: 7
