name: Enable KVM
description: >-
  Give the runner user access to /dev/kvm so the Android emulator boots
  hardware-accelerated (phase 402 D14: one copy for integration,
  integration-profile and patrol).

# Loaded from the PR head like every local `uses: ./…`: never use it in plan,
# tests-ran or ci-gate. why: docs/ci/README.md#trust
runs:
  using: composite
  steps:
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
